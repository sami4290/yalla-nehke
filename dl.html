<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>YN picture export</title></head>
<body style="font:16px sans-serif;padding:20px">
<h3>Yalla Nehke picture export</h3>
<button id="go" style="font-size:20px;padding:12px 20px">Download pictures</button>
<div id="s"></div>
<script>
const URL_='https://uadeadufficsfsjirabz.supabase.co/rest/v1/yn_pics';
const KEY='sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4';
document.getElementById('go').onclick=async()=>{
  const since=new URLSearchParams(location.search).get('since')||'1970-01-01';
  const r=await fetch(URL_+'?select=id,b64,created_at&created_at=gt.'+encodeURIComponent(since)+'&order=created_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  const rows=await r.json();
  const out={};rows.forEach(x=>out[x.id]=x.b64);
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yn_export_'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();
  document.getElementById('s').textContent='Exported '+rows.length+' pictures';
};
</script>
</body></html>
