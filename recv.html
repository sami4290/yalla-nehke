<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>YN picture inbox</title></head>
<body style="font:16px sans-serif;padding:20px">
<h3>Yalla Nehke picture inbox</h3>
<div id="s">Waiting for pictures…</div>
<script>
const URL_='https://uadeadufficsfsjirabz.supabase.co/rest/v1/yn_pics';
const KEY='sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4';
const OK_ORIGIN='https://chatgpt.com';
let total=0;
window.addEventListener('message',async e=>{
  if(e.origin!==OK_ORIGIN||!e.data||e.data.type!=='yn_pics')return;
  const items=e.data.items||{};const ids=Object.keys(items);const done=[];
  for(const id of ids){
    if(!/^[a-z0-9_#]{1,60}$/i.test(id))continue;
    try{
      const r=await fetch(URL_,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({id,b64:items[id]})});
      if(r.ok||r.status===409){done.push(id);total++}
    }catch(err){}
  }
  document.getElementById('s').textContent='Stored '+total+' pictures. Last: '+done.join(', ');
  e.source.postMessage({type:'yn_ack',done},e.origin);
});
if(window.opener)window.opener.postMessage({type:'yn_ready'},OK_ORIGIN);
</script>
</body></html>
