<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick new words</title>
<script src="supabase.js"></script>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:14px;background:#fffaf2;color:#222}h1{font-size:20px;margin:6px 0 4px}p.s{margin:0 0 12px;color:#666;font-size:14px}
.l{background:#fff;border-radius:12px;padding:10px 12px;margin:10px 0;box-shadow:0 1px 3px #0001}.l h2{font-size:15px;margin:0 0 6px}.l small{color:#888;font-weight:400}
label{display:flex;gap:10px;align-items:center;padding:8px 4px;font-size:16px;border-top:1px solid #f2ebe0}label:first-of-type{border-top:0}input{width:22px;height:22px}
.l.ok{outline:2px solid #3a3}button{width:100%;padding:14px;font-size:17px;border:0;border-radius:12px;background:#e8572a;color:#fff;margin:14px 0 30px}#m{text-align:center;font-weight:600}</style></head><body>
<h1>Pick the new words</h1><p class="s">Tick one word per lesson (two for Polite words), then tap Save.</p><div id="L"></div><div id="m"></div><button id="b">Save</button>
<script>
const D=[["Hello & how are you", 1, [["ahlan", "hi"], ["ahlēn", "hi (warm)"], ["hāy", "hey"], ["kīfkon?", "how are you all?"], ["shu fi ma fi?", "what's up?"], ["shu el-akhbār?", "what's new?"], ["tamēm", "great / perfect"], ["mesh baṭṭāl", "not bad"], ["mashi el-ḥāl", "doing OK"], ["kīf el-ʿēle?", "how's the family?"]]], ["Names & goodbye", 1, [["maʿ el-salēme", "goodbye"], ["bshūfak", "see you"], ["lal-liʾa", "see you soon"], ["Allah maʿak", "God be with you"], ["ciao", "bye"], ["addēsh ʿumrak?", "how old are you?"], ["ismo", "his name is"], ["isma", "her name is"], ["shu ismo?", "what's his name?"], ["mīn enta?", "who are you?"]]], ["Polite words", 2, [["ʿafwan", "you're welcome"], ["iza bitrīd", "please"], ["ʿan iznak", "excuse me"], ["mamnūn", "thanks a lot"], ["merci", "thanks"], ["tekram", "my pleasure"], ["law samaḥt", "excuse me / please"], ["ʿala rāsi", "with pleasure"], ["yislamu", "thank you (warm)"], ["ma fi jamīle", "don't mention it"]]], ["Fruit", 1, [["mishmish", "apricot"], ["ananās", "pineapple"], ["mango", "mango"], ["rummān", "pomegranate"], ["tīn", "figs"], ["jawz el-hind", "coconut"], ["afandi", "mandarin"], ["burdʾān", "orange (fruit)"], ["kiwi", "kiwi"], ["akkidinya", "loquat"]]], ["My toys", 1, [["lego", "lego"], ["poupée", "doll"], ["puzzle", "puzzle"], ["robot", "robot"], ["dinazōr", "dinosaur"], ["ṭiyyāra waraʾ", "kite"], ["dawwēme", "spinning top"], ["blokāt", "blocks"], ["pâte à modeler", "playdough"], ["trottinette", "scooter"]]], ["My senses", 1, [["lmos", "touch!"], ["rīḥa", "smell (noun)"], ["ṭaʿme", "taste (noun)"], ["ṣōt", "sound / voice"], ["bshūf", "I see"], ["bismaʿ", "I hear"], ["ʿāli", "loud"], ["wāṭi", "quiet"], ["iskot", "be quiet!"], ["shūf ʿalayye", "look at me"]]], ["Let's celebrate", 1, [["ʿīd milēd", "birthday"], ["kill sene w enta sālem", "happy birthday!"], ["zīne", "decorations"], ["ʿazīme", "invitation"], ["ḍyūf", "guests"], ["nfukh", "blow (the candles)!"], ["ʿīdiyye", "gift money"], ["zalghūṭa", "celebration cry"], ["sēḥer", "magician"], ["ʾaṭṭeʿ", "cut (the cake)!"]]], ["In class", 1, [["ʾalam raṣāṣ", "pencil"], ["mamḥāye", "rubber"], ["mabrāye", "sharpener"], ["masṭara", "ruler"], ["lūḥ", "board"], ["ṭabshūra", "chalk"], ["farḍ", "homework"], ["imtiḥān", "test"], ["maʾaṣṣ", "scissors"], ["ghira", "glue"]]], ["At the park", 1, [["ʾaʿde", "bench"], ["bisīn", "pool"], ["trampoline", "trampoline"], ["ḥashīsh", "grass"], ["nāfoura", "fountain"], ["pique-nique", "picnic"], ["zbēle", "bin"], ["khayme", "tent"], ["ḥajar", "stone"], ["zoo", "zoo"]]], ["Getting around", 1, [["motosikl", "motorbike"], ["ishāra", "traffic light"], ["jisr", "bridge"], ["ʾūtostrād", "motorway"], ["zaḥme", "traffic jam"], ["mawʾaf", "car park"], ["benzīn", "petrol"], ["dūlēb", "wheel"], ["zammūr", "horn"], ["servīs", "shared taxi"]]], ["Weather", 1, [["ghēm", "clouds"], ["shamsiyye", "umbrella"], ["raʿd", "thunder"], ["barʾ", "lightning"], ["ʿāṣfe", "storm"], ["ʾōs ʾuzaḥ", "rainbow"], ["ḍabāb", "fog"], ["saʾʿa", "freezing cold"], ["dēfi", "warm"], ["rṭūbe", "humidity"]]], ["Saying sorry", 1, [["ʾāsef", "I'm sorry"], ["sāmeḥni", "forgive me"], ["ma ʾṣadt", "I didn't mean it"], ["ma ʿād baʿmela", "I won't do it again"], ["bḥebbak", "I love you"], ["ʿan jadd", "really / seriously"], ["ṣāfi", "all good now"], ["ghalṭi", "my mistake"], ["ḥaʾʾak ʿalayye", "my fault"], ["ghalṭān", "wrong"]]], ["Nice words", 1, [["ʿazīm", "great"], ["wāw", "wow"], ["ʿāl", "excellent"], ["mumtāz", "top / excellent"], ["ʾalbi", "my heart"], ["rūḥi", "my soul / my love"], ["yā ʿayni", "my dear"], ["taʾburni", "love you so much"], ["ḥabbūb", "sweet / lovable"], ["shaṭṭūr", "good kid"]]], ["On the team", 1, [["kaptin", "captain"], ["malʿab", "pitch"], ["ṣaffāra", "whistle"], ["ḥāris", "goalkeeper"], ["jumhūr", "crowd / fans"], ["mbārāt", "match"], ["tamrīn", "training"], ["pāsa", "pass!"], ["kōtsh", "coach"], ["shabake", "net"]]], ["Win or lose", 1, [["awwal", "first"], ["tēni", "second"], ["ākher", "last"], ["taʿādol", "a draw"], ["kās", "trophy"], ["jāyze", "prize"], ["mīdāliye", "medal"], ["sibāʾ", "race"], ["baṭal", "champion"], ["ʾawi", "strong"]]], ["Getting there", 1, [["metro", "metro"], ["shakhtūra", "boat"], ["helicopter", "helicopter"], ["téléphérique", "cable car"], ["shanṭet safar", "suitcase"], ["ṭayyār", "pilot"], ["mḍīfa", "flight attendant"], ["ṣārūkh", "rocket"], ["vān", "van"], ["jīb", "jeep"]]]];
const $=id=>document.getElementById(id),L=$('L');
D.forEach(([t,n,o],i)=>{const d=document.createElement('div');d.className='l';d.innerHTML=`<h2>${i+1}. ${t} <small>(pick ${n})</small></h2>`+o.map(([s,e],j)=>`<label><input type="checkbox" data-l="${i}" data-j="${j}"> <b>${s}</b> – ${e}</label>`).join('');L.appendChild(d)});
L.addEventListener('change',e=>{const i=+e.target.dataset.l,n=D[i][1],bx=[...L.querySelectorAll(`input[data-l="${i}"]`)],c=bx.filter(x=>x.checked);if(c.length>n){e.target.checked=false}L.children[i].classList.toggle('ok',bx.filter(x=>x.checked).length===n)});
const sb=supabase.createClient('https://uadeadufficsfsjirabz.supabase.co','sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4');
$('b').onclick=async()=>{const out=D.map(([t,n,o],i)=>({lesson:t,picks:[...L.querySelectorAll(`input[data-l="${i}"]:checked`)].map(x=>o[+x.dataset.j][0])}));
const miss=out.filter((x,i)=>x.picks.length!==D[i][1]).map(x=>x.lesson);
if(miss.length&&!confirm('Not finished: '+miss.join(', ')+'. Save anyway?'))return;
$('m').textContent='Saving…';try{const x=await sb.from('beta_feedback').insert({tester:'sami',comment:'word picks',item_type:'word_picks',item:{picks:out},lesson:'short lessons',voice:'both',page:'pick-words'});if(x.error)throw x.error;$('m').textContent='✓ Saved. Tell Claude "done".'}catch(e){$('m').textContent='Could not save: '+(e.message||e)}};
</script></body></html>
