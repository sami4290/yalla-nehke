<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review recorded words – Yalla Nehke</title>
<style>
:root{--c:#E5487F;--ink:#14213d;--line:#e3e8ef;--ok:#1f9d55}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f8fb;color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;position:sticky;top:0;z-index:3}h1{margin:0;font-size:18px}.sub{font-size:13px;color:#5b6b82;margin-top:4px}
h2{margin:18px 14px 6px;font-size:15px;color:#5b6b82}.row{background:#fff;margin:6px 14px;border-radius:12px;padding:10px 12px;box-shadow:0 1px 5px rgba(20,33,61,.07)}
.w{font-size:20px;font-weight:700}.w small{font-size:13px;font-weight:400;color:#8592a6;margin-left:6px}.bt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;background:#eef1f5;color:var(--ink)}button.z{background:#ffe3ee}button.k{background:#dfeeff}button.on{outline:3px solid var(--c)}
.rp.sent{background:#fff3cd}.rpb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rpb input{flex:1;min-width:160px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}.rpb .go{background:var(--c);color:#fff}
.row.rq .w{text-decoration:line-through;opacity:.6}
</style></head><body><header><h1>Review recorded words</h1><div class="sub">Tap Zena or Karim to listen. If a word sounds wrong, tap Replace and say what to do.</div></header><div id="m"></div>
<script src="supabase.js"></script><script>
const W=[{"id": "q_1_4_0", "b": 0, "say": "Bisseh gives you a present! Say “thank you”.", "en": "L1 · Polite words"}, {"id": "q_4_1_0", "b": 0, "say": "kam bisse? 🐱🐱🐱 – How many cats? Count them in Lebanese.", "en": "L1 · Numbers 1–5"}, {"id": "q_4_1_1", "b": 0, "say": "kam ṭābe? ⚽⚽ – How many balls? Count them in Lebanese.", "en": "L1 · Numbers 1–5"}, {"id": "q_4_2_0", "b": 0, "say": "kam tiffēḥa? 🍎🍎🍎🍎🍎🍎 – How many apples? Count them in Lebanese.", "en": "L1 · Numbers 6–10"}, {"id": "q_4_2_1", "b": 0, "say": "kam iṣbaʿ? 🖐️🖐️ – How many fingers? Count them in Lebanese.", "en": "L1 · Numbers 6–10"}, {"id": "q_4_3_0", "b": 0, "say": "shu lawno? 🍎 – What colour is the apple? Say the colour.", "en": "L1 · Colours"}, {"id": "q_4_3_1", "b": 0, "say": "shu lawno? 🍀 – What colour is the leaf? Say the colour.", "en": "L1 · Colours"}, {"id": "q_2_4_2_0", "b": 0, "say": "kīf eṭ-ṭaʾs? ☀️🥵 – How is the weather? It’s very hot – say “it’s hot!”", "en": "L2 · Weather"}, {"id": "q_2_4_2_1", "b": 0, "say": "kīf eṭ-ṭaʾs? 🌧️ – How is the weather? It’s raining – say “it’s raining”.", "en": "L2 · Weather"}],IZ={"q_1_4_0": [0.35, 2.46], "q_4_1_0": [3.16, 3.897], "q_4_1_1": [7.407, 3.668], "q_4_2_0": [11.425, 3.778], "q_4_2_1": [15.553, 3.678], "q_4_3_0": [19.581, 3.478], "q_4_3_1": [23.409, 3.478], "q_2_4_2_0": [27.237, 5.118], "q_2_4_2_1": [32.704, 5.378]},IK={"q_1_4_0": [0.35, 2.86], "q_4_1_0": [3.56, 4.397], "q_4_1_1": [8.307, 4.038], "q_4_2_0": [12.696, 4.328], "q_4_2_1": [17.374, 4.248], "q_4_3_0": [21.972, 3.868], "q_4_3_1": [26.19, 4.128], "q_2_4_2_0": [30.668, 6.028], "q_2_4_2_1": [37.046, 5.968]};
const SB=window.supabase.createClient('https://uadeadufficsfsjirabz.supabase.co','sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4');
const AZ=new Audio('audio/zena_p9d.mp3'),AK=new Audio('audio/karim_p9d.mp3');let cur=null,tm=null;
function play(v,id){const a=v==='z'?AZ:AK,x=(v==='z'?IZ:IK)[id];if(!x)return;[AZ,AK].forEach(p=>p.pause());clearTimeout(tm);a.currentTime=x[0];a.play();tm=setTimeout(()=>a.pause(),x[1]*1000+80)}
const RP='yn_rev_rep';function rg(){try{return JSON.parse(localStorage.getItem(RP)||'{}')}catch(e){return {}}}function rs(id,t){try{const a=rg();a[id]=t||'1';localStorage.setItem(RP,JSON.stringify(a))}catch(e){}}
function draw(){const q=rg();const only=new URLSearchParams(location.search).get('ids');const WS=only?W.filter(w=>only.split(',').includes(w.id)):W;let h='',b=0;WS.forEach(w=>{if(w.b!==b){b=w.b;h+=`<h2>Batch ${b}</h2>`}h+=`<div class="row ${q[w.id]?'rq':''}" data-id="${w.id}"><div class="w">${w.say}<small>${w.en}</small></div><div class="bt"><button class="z" data-v="z">▶ Zena</button><button class="k" data-v="k">▶ Karim</button><button class="rp ${q[w.id]?'sent':''}">${q[w.id]?'↻ Replace requested':'↻ Replace'}</button></div></div>`});$('m').innerHTML=h;
 document.querySelectorAll('.row').forEach(r=>{const id=r.dataset.id;r.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>play(b.dataset.v,id));r.querySelector('.rp').onclick=()=>open(r,id)})}
const $=i=>document.getElementById(i);
function open(r,id){if(r.querySelector('.rpb'))return;const w=W.find(x=>x.id===id);const d=document.createElement('div');d.className='rpb';d.innerHTML='<input placeholder="What to change (optional)"><button class="go">Send</button><button class="no">Cancel</button><span class="m" style="font-size:13px;align-self:center"></span>';r.appendChild(d);const i=d.querySelector('input'),m=d.querySelector('.m');i.focus();d.querySelector('.no').onclick=()=>d.remove();
 d.querySelector('.go').onclick=async()=>{m.textContent='Sending…';try{const x=await SB.from('beta_feedback').insert({tester:'sami',comment:(i.value.trim()||'Redo this word').slice(0,500),item_type:'replace',item:{id:w.id,say:w.say,en:w.en,batch:w.b,from:'review'},lesson:'review batch '+w.b,voice:'both',page:'rec-review2'});if(x.error)throw x.error;rs(id,i.value.trim());draw()}catch(e){m.textContent='Could not send: '+(e.message||e)}}}
draw();
</script></body></html>
