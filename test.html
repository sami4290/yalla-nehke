<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalla Nehke – TEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   YALLA NEHKE – DESIGN SYSTEM (presentation only)
   Class names and variable names are unchanged; the JS relies on them.
   ========================================================== */
:root{
 /* palette */
 --sky:#4CB5F5;--sky-d:#2A8FD1;--sky-l:#E3F4FE;
 --turq:#1CC5B7;--turq-d:#0E958B;--turq-l:#E1F8F5;
 --orange:#FF8A3D;--orange-d:#E2661A;--orange-l:#FFF0E3;
 --purple:#8C5CF5;--purple-d:#6A3BD6;--purple-l:#F1EBFF;
 --pink:#FF6FA9;--pink-d:#E04888;--pink-l:#FFEAF3;
 --cream:#FFF8EC;--white:#fff;
 --navy:#1E2A5A;--navy-2:#3A4677;
 /* legacy names used by the JS inline styles – remapped */
 --bg:var(--cream);--card:#fff;--ink:var(--navy);--soft:#66709A;--line:#E2E7F4;
 --teal:var(--turq);--teal-d:var(--turq-d);
 --yellow:#FFC83D;--yellow-d:#E0A214;
 --red:#F2545B;--green:#2DBE6C;--green-bg:#E5F8EC;--red-bg:#FFECEC;
 --sea:#BDEBFA;--sea-d:#8FD6EE;
 /* shape */
 --r-xs:12px;--r-sm:16px;--r-md:22px;--r-lg:28px;--r-xl:34px;--r-pill:999px;
 /* elevation */
 --sh-1:0 2px 0 rgba(30,42,90,.05),0 6px 16px rgba(30,42,90,.07);
 --sh-2:0 3px 0 rgba(30,42,90,.06),0 12px 28px rgba(30,42,90,.12);
 --sh-press:0 5px 0;
 /* spacing scale: 4 · 8 · 12 · 16 · 24 · 32 */
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--cream)}
html,body{margin:0;color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-weight:500;font-size:17px;overscroll-behavior:none}
body{background:transparent;min-height:100vh}
/* background treatment: sky wash + soft colour blobs + clouds */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:
  radial-gradient(60px 22px at 14% 9%,rgba(255,255,255,.95) 98%,transparent),
  radial-gradient(42px 18px at 20% 7.5%,rgba(255,255,255,.95) 98%,transparent),
  radial-gradient(70px 24px at 82% 15%,rgba(255,255,255,.9) 98%,transparent),
  radial-gradient(46px 18px at 88% 13%,rgba(255,255,255,.9) 98%,transparent),
  radial-gradient(420px 320px at 105% 30%,rgba(255,111,169,.13),transparent 70%),
  radial-gradient(380px 300px at -10% 55%,rgba(140,92,245,.11),transparent 70%),
  radial-gradient(420px 300px at 50% 105%,rgba(28,197,183,.13),transparent 70%),
  linear-gradient(180deg,#BFE6FB 0,#DCF1FD 220px,#FFF8EC 520px,#FFF8EC 100%)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.screen{padding:var(--s4) 18px 120px;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- typography ---------- */
h1{font-size:30px;font-weight:800;margin:var(--s1) 0;line-height:1.12;letter-spacing:-.01em;color:var(--navy)}
h2{font-size:23px;font-weight:800;margin:0 0 10px;line-height:1.2;color:var(--navy)}
h3{font-size:18px;font-weight:800;margin:0 0 var(--s2);color:var(--navy-2);letter-spacing:.01em}
.sub{color:var(--soft);font-size:17px;font-weight:600;line-height:1.35;margin:0 0 var(--s4)}
.note{font-size:14px;font-weight:600;color:var(--soft);line-height:1.4}
label{display:block;font-size:15px;font-weight:800;color:var(--navy-2);margin:var(--s4) 0 var(--s2)}

/* ---------- buttons ---------- */
.btn{position:relative;background:linear-gradient(180deg,#2FD6C8,var(--turq));color:#fff;font-weight:800;font-size:19px;letter-spacing:.01em;min-height:56px;padding:12px 24px;border-radius:var(--r-md);box-shadow:var(--sh-press) var(--turq-d),0 10px 18px rgba(14,149,139,.22);text-shadow:0 1px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s}
.btn::after{content:'';position:absolute;left:14px;right:14px;top:6px;height:30%;border-radius:var(--r-pill);background:rgba(255,255,255,.22);pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--turq-d)}
.btn.y{background:linear-gradient(180deg,#FFD25A,#FFB21E);color:var(--navy);text-shadow:none;box-shadow:var(--sh-press) var(--yellow-d),0 10px 18px rgba(224,162,20,.22)}
.btn.y:active{box-shadow:0 1px 0 var(--yellow-d)}
.btn.ghost{background:#fff;color:var(--navy);text-shadow:none;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost::after{display:none}
.btn.wide{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- cards & forms ---------- */
.card{background:#fff;border:2px solid rgba(226,231,244,.8);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1)}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:19px;font-weight:600;padding:12px 16px;border-radius:var(--r-sm);border:2px solid var(--line);background:#F8FAFF;color:var(--navy);transition:border-color .15s,background .15s}
input[type=text]:focus,input[type=number]:focus{border-color:var(--sky);background:#fff;outline:none}
.seg{display:flex;gap:var(--s2);flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:#fff;border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 10px;font-size:16px;font-weight:800;color:var(--navy-2);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.seg button:active{transform:translateY(2px)}
.seg button.on{border-color:var(--purple);background:var(--purple-l);color:var(--purple-d);box-shadow:0 3px 0 #D6C6FF}
.seg small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.err{color:var(--red);font-size:14px;font-weight:700;min-height:18px;margin:6px 0}

/* ---------- top stats bar ---------- */
.stats{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s2);padding:10px 16px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:none;border-radius:0 0 var(--r-md) var(--r-md);box-shadow:0 6px 18px rgba(30,42,90,.08)}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px;padding:4px 12px;border-radius:var(--r-pill)}
.stat.fire{color:var(--orange-d);background:var(--orange-l)}
.stat.xp{color:#B57A06;background:#FFF5D6}
.stat.wd{color:var(--sky-d);background:var(--sky-l)}
.goal{margin-left:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 3px 8px rgba(30,42,90,.12)}

/* ---------- level tabs ---------- */
.ltabs{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s3) 2px var(--s1);scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltab{flex:0 0 auto;background:#fff;border:2px solid var(--line);border-radius:var(--r-pill);padding:7px 16px;font-weight:800;font-size:15px;color:var(--navy-2);white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.ltab.on{background:linear-gradient(135deg,var(--purple),#A77BFF);color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--purple-d)}

/* ---------- learning-journey map ---------- */
.unit{position:relative;overflow:hidden;margin:22px 0 var(--s2);border-radius:var(--r-lg);padding:14px 16px;color:#fff;display:flex;align-items:center;gap:var(--s3);box-shadow:0 5px 0 rgba(0,0,0,.14),0 12px 24px rgba(30,42,90,.12)}
.unit::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),radial-gradient(140px 90px at 100% 0,rgba(255,255,255,.25),transparent 70%);pointer-events:none}
.unit>*{position:relative}
.unit .ui{font-size:30px;width:54px;height:54px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.unit b{font-size:20px;font-weight:800;display:block;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.unit span{font-size:14px;font-weight:600;opacity:.95}
.unit .jump{margin-left:auto;background:rgba(255,255,255,.95);color:var(--navy);border:none;border-radius:var(--r-pill);padding:7px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sea{position:relative;border-radius:var(--r-xl);background:linear-gradient(180deg,#A9E2F8 0,#C9EEFB 45%,#BDF0EA 100%);padding:44px 0 26px;margin-bottom:var(--s2);overflow:hidden;border:4px solid #fff;box-shadow:var(--sh-2)}
.sea::before{content:'';position:absolute;inset:0;background:radial-gradient(3px 3px at 18% 22%,#fff 98%,transparent),radial-gradient(3px 3px at 72% 40%,#fff 98%,transparent),radial-gradient(2px 2px at 40% 70%,#fff 98%,transparent),radial-gradient(2px 2px at 85% 80%,#fff 98%,transparent);opacity:.8;pointer-events:none}
.wave{position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 10px -4px,transparent 12px,#fff 13px,transparent 14px) repeat-x;background-size:24px 10px;opacity:.55}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
.isle{position:relative;width:104px;height:90px;display:flex;align-items:center;justify-content:center}
.isle::before{content:'';position:absolute;inset:auto 0 0 0;height:46px;border-radius:50%;background:radial-gradient(60% 70% at 50% 35%,#FCE4B0,#F2CF8A);box-shadow:inset 0 -6px 0 #E2B868,0 6px 0 rgba(28,197,183,.25)}
.isle::after{content:'🌴';position:absolute;right:-6px;top:2px;font-size:24px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.12))}
.node{position:relative;z-index:1;width:74px;height:66px;border-radius:50%;font-size:28px;font-weight:800;display:grid;place-items:center;color:#fff;border:4px solid #fff;text-shadow:0 2px 0 rgba(0,0,0,.15);box-shadow:0 7px 0 rgba(0,0,0,.18),0 12px 18px rgba(30,42,90,.18);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.node.locked{background:#D9DEEB!important;color:#8B93B2;text-shadow:none;box-shadow:0 7px 0 #BCC3D8}
.node.cur{animation:bob 1.6s ease-in-out infinite;box-shadow:0 7px 0 rgba(0,0,0,.18),0 0 0 7px rgba(255,200,61,.55),0 0 26px 8px rgba(255,200,61,.45)}
@keyframes bob{50%{transform:translateY(-6px)}}
.node .stz{position:absolute;bottom:-28px;font-size:13px;letter-spacing:-1px;white-space:nowrap;text-shadow:none;filter:drop-shadow(0 1px 0 #fff)}
.node.chest{border-radius:var(--r-md);width:82px}
.here{position:absolute;width:60px;height:60px;border-radius:50%;background-color:var(--sky-l);background-size:290%;background-position:50% 4%;border:4px solid #fff;box-shadow:0 4px 12px rgba(30,42,90,.25);top:6px;z-index:2}
.tip{position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:800;letter-spacing:.04em;border:none;border-radius:var(--r-pill);padding:2px 12px;white-space:nowrap;z-index:3;box-shadow:0 3px 8px rgba(30,42,90,.25)}
.tip::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--navy)}
.soon{background:rgba(255,255,255,.85);border:2px dashed #CFD6EA;border-radius:var(--r-md);padding:var(--s4);margin:var(--s3) 0}

/* ---------- bottom navigation ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:none;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px rgba(30,42,90,.12);display:flex;gap:var(--s1);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}
.nav button{flex:1;background:none;font-size:12px;font-weight:800;color:var(--soft);padding:4px 0 2px;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.nav button i{font-style:normal;font-size:22px;width:46px;height:36px;display:grid;place-items:center;border-radius:var(--r-pill);transition:background .15s,transform .15s}
.nav button.on{background:none}
.nav button.on i{transform:translateY(-2px)}
.nav button[data-t=map].on{color:var(--sky-d)}.nav button[data-t=map].on i{background:var(--sky-l)}
.nav button[data-t=practice].on{color:var(--orange-d)}.nav button[data-t=practice].on i{background:var(--orange-l)}
.nav button[data-t=rewards].on{color:var(--purple-d)}.nav button[data-t=rewards].on i{background:var(--purple-l)}
.nav button[data-t=parents].on{color:var(--pink-d)}.nav button[data-t=parents].on i{background:var(--pink-l)}

/* ---------- lesson ---------- */
.ltop{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.x{background:#fff;border:2px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:18px;font-weight:800;color:var(--soft);flex-shrink:0;box-shadow:0 3px 0 var(--line)}
.bar{flex:1;height:18px;background:#fff;border:none;border-radius:var(--r-pill);overflow:hidden;box-shadow:inset 0 2px 4px rgba(30,42,90,.1)}
.bar i{display:block;height:100%;width:0;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--turq),var(--sky));box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.3);transition:width .4s}
.guide{display:flex;align-items:flex-end;gap:10px;margin-bottom:var(--s3)}
.av{width:84px;height:84px;border-radius:50%;background-color:var(--sky-l);background-repeat:no-repeat;background-size:290%;background-position:50% 4%;border:4px solid #fff;box-shadow:0 4px 12px rgba(30,42,90,.16);flex-shrink:0}
.av.full{border:4px solid #fff;border-radius:var(--r-md);box-shadow:var(--sh-1);background-color:#FFF8EC;background-size:contain;background-position:center bottom;width:108px;height:116px}
.clip{display:block;margin:0 auto 10px;border-radius:var(--r-xl);object-fit:cover;background:#fff;border:4px solid #fff;box-shadow:var(--sh-2)}
.av.jump{animation:jump .5s}.av.no{animation:shake .4s}
@keyframes jump{40%{transform:translateY(-14px) scale(1.05)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bubble{background:#fff;border:none;border-radius:var(--r-md) var(--r-md) var(--r-md) 6px;padding:12px 16px;font-size:18px;font-weight:600;line-height:1.35;color:var(--navy);flex:1;position:relative;box-shadow:var(--sh-1)}
button.spk{cursor:pointer;font-family:inherit}
.spk{position:absolute;top:-13px;right:12px;background:var(--turq);color:#fff;border-radius:var(--r-pill);font-size:11px;font-weight:800;padding:2px 9px;border:2px solid #fff;box-shadow:0 2px 6px rgba(14,149,139,.3)}
.qline{font-size:24px;color:var(--purple-d);font-weight:800}
.word{text-align:center}
.gbig{display:block;width:150px;height:150px;object-fit:contain;margin:6px auto 2px;background:none;border:0}.gsm{width:84px;height:84px;object-fit:contain}.gpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.gcard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:var(--navy)}.gcard .gk{font-weight:800;font-size:15px}.gcard .gar{font-size:30px;line-height:1.3}.gcard .gtr{font-weight:800;font-size:20px}.gcard .gplay{font-size:18px}.gcard[data-g=b]{border-color:#9cc7f5}.gcard[data-g=g]{border-color:#f5a3c4}.gcard.me{box-shadow:0 0 0 3px #ffd34d}.gcard.on{background:#fffbe8}
.pic{width:184px;height:184px;margin:0 auto var(--s2);border-radius:var(--r-xl);background:#fff;border:5px solid #fff;display:grid;place-items:center;font-size:96px;overflow:hidden;box-shadow:var(--sh-2)}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r-xl) - 6px)}
.num{font-size:96px;font-weight:800;color:var(--purple);text-shadow:0 5px 0 var(--purple-l)}
.swatch{width:120px;height:120px;border-radius:50%;border:6px solid #fff;box-shadow:var(--sh-2)}
.big-ar{font-size:44px;line-height:1.35;margin:0;color:var(--navy)}
.tr{font-size:28px;font-weight:800;color:var(--turq-d);margin:0}
.en{font-size:18px;font-weight:600;color:var(--soft);margin:0}
.yourturn{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:var(--s3)}
.mic{width:96px;height:96px;border-radius:50%;background:linear-gradient(180deg,#FF86B7,var(--pink));color:#fff;font-size:38px;border:5px solid #fff;box-shadow:0 6px 0 var(--pink-d),0 12px 24px rgba(224,72,136,.3)}
.mic.live{animation:pulse .8s infinite;box-shadow:0 6px 0 var(--pink-d),0 0 0 10px rgba(255,111,169,.25)}
@keyframes pulse{50%{transform:scale(1.08)}}
.meter{width:100%;max-width:300px;height:16px;border-radius:var(--r-pill);background:#fff;border:none;overflow:hidden;box-shadow:inset 0 2px 4px rgba(30,42,90,.1)}
.meter i{display:block;height:100%;width:0;border-radius:var(--r-pill);transition:width .4s}
.heard{font-size:15px;font-weight:600;color:var(--soft);text-align:center}
.ring{width:84px;height:84px;border-radius:50%;border:8px solid var(--yellow);background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;box-shadow:var(--sh-1);animation:pulse 1s infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.opt{background:#fff;border:3px solid var(--line);border-radius:var(--r-md);min-height:124px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);font-size:18px;font-weight:800;color:var(--navy);box-shadow:0 5px 0 var(--line),0 10px 18px rgba(30,42,90,.06);transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt .e{font-size:54px;line-height:1}.opt .oa{font-size:26px}.opt .ot{font-size:17px;color:var(--turq-d)}
.opt.sel{border-color:var(--purple);background:var(--purple-l);box-shadow:0 5px 0 #D6C6FF}
.opt.ok{border-color:var(--green);background:var(--green-bg);box-shadow:0 5px 0 #B9E8CB}
.opt.no{border-color:var(--red);background:var(--red-bg);box-shadow:0 5px 0 #F7C3C5;animation:shake .35s}
.opts.list{grid-template-columns:1fr}.opts.list .opt{min-height:66px;flex-direction:row;justify-content:space-between;padding:10px 18px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{background:#fff;border:3px solid var(--line);border-radius:var(--r-sm);min-height:64px;padding:6px;font-weight:800;font-size:17px;color:var(--navy);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 0 var(--line)}
.mt .ar{font-size:24px}
.mt.sel{border-color:var(--purple);background:var(--purple-l);box-shadow:0 4px 0 #D6C6FF}
.mt.done{opacity:.35;border-color:var(--green);pointer-events:none}
.mt.no{border-color:var(--red);animation:shake .35s}
.kid{align-self:flex-end;margin-left:auto;background:var(--turq-l);border:2px solid #BDEDE7;border-radius:var(--r-md) var(--r-md) 6px var(--r-md);padding:10px 16px;font-size:18px;font-weight:600;color:var(--navy);max-width:80%;width:fit-content;box-shadow:var(--sh-1)}
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;padding:16px 18px calc(16px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:none;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px rgba(30,42,90,.12);z-index:6}
.foot.good{background:#E5F8EC}.foot.bad{background:#FFECEC}
.foot .msg{font-weight:800;font-size:21px;margin-bottom:10px}.foot.good .msg{color:#1C8A4C}.foot.bad .msg{color:#C9363D}
.foot.good .btn{background:linear-gradient(180deg,#43D27F,var(--green));box-shadow:var(--sh-press) #1C8A4C}
.foot.bad .btn{background:linear-gradient(180deg,#FF6E74,var(--red));box-shadow:var(--sh-press) #C9363D}
.hint{font-size:15px;font-weight:600;background:#FFF7DB;border:2px dashed #F3D57A;border-radius:var(--r-sm);padding:10px 12px;text-align:center;color:var(--navy-2)}

/* ---------- results, badges, milestones ---------- */
.center{text-align:center}
.bigstar{font-size:72px;line-height:1;filter:drop-shadow(0 6px 8px rgba(224,162,20,.35))}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:var(--s4) 0}
.chip{background:#fff;border:none;border-top:5px solid var(--sky);border-radius:var(--r-md);padding:10px 16px;font-size:22px;font-weight:800;color:var(--navy);min-width:96px;box-shadow:var(--sh-1)}
.chip:nth-child(2){border-top-color:var(--orange)}.chip:nth-child(3){border-top-color:var(--purple)}
.chip small{display:block;font-weight:700;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.newstk{display:inline-grid;place-items:center;width:132px;height:132px;margin:6px auto;font-size:76px;border-radius:50%;background:radial-gradient(circle,#FFF5D1 55%,#FFE08A);border:5px solid #fff;box-shadow:0 0 0 4px var(--yellow),var(--sh-2);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:var(--s2) 0 var(--s5)}
.stk{background:rgba(255,255,255,.75);border:2px dashed #CFD6EA;border-radius:var(--r-md);padding:12px 4px 10px;text-align:center;font-size:12px;color:var(--soft);font-weight:800;line-height:1.2}
.stk .e{font-size:36px;display:grid;place-items:center;width:54px;height:54px;margin:0 auto 6px;border-radius:50%;background:#EEF1F8;filter:grayscale(1);opacity:.35}
.stk.got{background:#fff;border:2px solid #FFE3A0;color:var(--navy);box-shadow:var(--sh-1)}
.stk.got .e{filter:none;opacity:1;background:radial-gradient(circle,#FFF5D1 55%,#FFE08A);box-shadow:0 0 0 3px var(--yellow)}
.cert{position:relative;border:6px solid transparent;border-radius:var(--r-xl);padding:26px 22px;text-align:center;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--orange),var(--pink),var(--purple),var(--sky),var(--turq)) border-box;box-shadow:var(--sh-2)}
.cert h1{font-size:34px;color:var(--purple-d)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- parent area ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:none;border-left:6px solid var(--sky);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh-1)}
.kpi:nth-child(6n+2){border-left-color:var(--turq)}.kpi:nth-child(6n+3){border-left-color:var(--orange)}.kpi:nth-child(6n+4){border-left-color:var(--purple)}.kpi:nth-child(6n+5){border-left-color:var(--pink)}.kpi:nth-child(6n+6){border-left-color:var(--yellow)}
.kpi b{font-size:26px;font-weight:800;display:block;color:var(--navy)}
.kpi span{font-size:13px;font-weight:600;color:var(--soft)}
.prow{display:flex;align-items:center;gap:10px;margin:var(--s2) 0;font-weight:700}
.prow .pb{flex:1;height:14px;background:#fff;border:none;border-radius:var(--r-pill);overflow:hidden;box-shadow:inset 0 2px 4px rgba(30,42,90,.1)}
.prow .pb i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--turq),var(--sky))}
.pill{display:inline-block;background:var(--red-bg);color:#C9363D;border-radius:var(--r-pill);padding:3px 12px;margin:3px;font-weight:800;font-size:14px}

/* ---------- modal panel ---------- */
.sheet{position:fixed;inset:0;background:rgba(30,42,90,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.sheet .in{background:#fff;width:100%;max-width:560px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(30,42,90,.2)}
.sheet .in::before{content:'';display:block;width:46px;height:5px;border-radius:var(--r-pill);background:var(--line);margin:-10px auto 14px}

/* ==========================================================
   HOME / DASHBOARD (map screen)
   ========================================================== */
.hero{position:relative;overflow:hidden;margin:6px 0 4px;border-radius:var(--r-xl);border:4px solid #fff;min-height:232px;box-shadow:var(--sh-2);background:#6EC3F2 url(home_hero.webp) 30% 60%/cover no-repeat}
.hero-in{position:relative;display:flex;align-items:flex-end;gap:4px;padding:16px 8px 14px 16px;min-height:224px}
.hero-txt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:6px}
.kick{background:rgba(255,255,255,.92);color:var(--purple-d);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:3px 12px;border-radius:var(--r-pill);box-shadow:0 2px 6px rgba(30,42,90,.12)}
.hero .bubble{flex:none;font-size:19px;font-weight:700;border-radius:var(--r-md) var(--r-md) 6px var(--r-md);box-shadow:var(--sh-2)}
.hprog{display:flex;align-items:center;gap:8px;width:100%;background:rgba(255,255,255,.92);border-radius:var(--r-pill);padding:5px 12px 5px 6px;box-shadow:0 3px 10px rgba(30,42,90,.12)}
.hbar{flex:1;height:12px;border-radius:var(--r-pill);background:#E7ECF7;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--yellow),var(--orange));min-width:6px}
.hprog span{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
.hero-txt{position:relative;z-index:2}
/* character framed in a Lebanese-style arched window */
.hero-ch{position:relative;flex:0 0 142px;align-self:flex-end;margin-bottom:6px}
.hero .av.full{position:relative;width:142px;height:176px;border:4px solid #fff;border-radius:71px 71px 22px 22px;background-color:#FDF4E4;background-size:120%;background-position:50% 100%;box-shadow:0 0 0 4px rgba(255,200,61,.55),var(--sh-2)}
.jhead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 0}
.jhead h2{margin:0;font-size:22px}
.ubar{margin-top:6px;height:8px;width:100%;max-width:200px;border-radius:var(--r-pill);background:rgba(255,255,255,.35);overflow:hidden}
.ubar i{display:block;height:100%;border-radius:var(--r-pill);background:#fff}
.path::before{content:'';position:absolute;top:30px;bottom:30px;left:50%;margin-left:-3px;border-left:6px dotted rgba(255,255,255,.85);z-index:0}
.isle{z-index:1}

/* ==========================================================
   ALL SCREENS – consistency pass (presentation only)
   ========================================================== */
/* characters: same arched-window frame everywhere */
.av.full{border-radius:56px 56px 20px 20px}
.guide .av.full{box-shadow:0 0 0 3px rgba(255,200,61,.45),var(--sh-1)}

/* page title banners for the tab screens */
.screen>h1:first-child{position:relative;overflow:hidden;margin:6px 0 10px;padding:18px 20px;border-radius:var(--r-lg);color:#fff;font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.12);background:linear-gradient(135deg,var(--sky),var(--turq));box-shadow:0 5px 0 rgba(0,0,0,.12),var(--sh-2)}
.screen>h1:first-child::before,.screen>h1:first-child::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.18);pointer-events:none}
.screen>h1:first-child::before{width:120px;height:120px;right:-30px;top:-50px}
.screen>h1:first-child::after{width:70px;height:70px;right:70px;bottom:-40px}
.screen:has(#pr)>h1:first-child{background:linear-gradient(135deg,#FFA65C,var(--orange))}
.screen:has(.book)>h1:first-child{background:linear-gradient(135deg,#A77BFF,var(--purple))}
.screen:has(#pg)>h1:first-child,.screen:has(.grid2)>h1:first-child{background:linear-gradient(135deg,#FF8DBB,var(--pink))}
.screen>h1:first-child+.sub{margin-top:4px}
.screen:has(.grid2)>h1:first-child+.sub{display:inline-block;background:#fff;border-radius:var(--r-pill);padding:4px 14px;box-shadow:var(--sh-1);font-size:15px}

/* setup / onboarding: illustrated welcome header */
.screen:has(#nm)>div:first-child{position:relative;overflow:hidden;margin:6px 0 16px;padding:22px 16px 16px;border-radius:var(--r-xl);border:4px solid #fff;background:#6EC3F2 url(home_hero.webp) 30% 55%/cover no-repeat;box-shadow:var(--sh-2)}
.screen:has(#nm)>div:first-child>div:first-child{display:none}
.screen:has(#nm)>div:first-child h1,.screen:has(#nm)>div:first-child .sub{display:inline-block;background:rgba(255,255,255,.94);border-radius:var(--r-md);padding:6px 16px;box-shadow:var(--sh-1)}
.screen:has(#nm)>div:first-child h1{color:var(--purple-d);font-size:30px;margin:60px 0 8px}
.screen:has(#nm)>div:first-child .sub{margin:0;font-size:15px;color:var(--navy-2)}
.screen:has(#nm) .card label:first-child{margin-top:4px}

/* lesson: finish flag on the progress bar */
.ltop::after{content:'🏁';font-size:22px;line-height:1;margin-left:-4px}

/* new-word card */
.word{background:#fff;border-radius:var(--r-xl);padding:18px 14px 14px;margin:6px 0 4px;box-shadow:var(--sh-1);border:2px solid rgba(226,231,244,.8)}
.word .pic{box-shadow:0 0 0 6px var(--sky-l),var(--sh-1)}

/* speaking panel */
.yourturn:not(:empty){background:linear-gradient(180deg,#fff,var(--pink-l));border:2px solid #FFD3E4;border-radius:var(--r-lg);padding:30px 16px 16px;position:relative;box-shadow:var(--sh-1)}
.yourturn:not(:empty)::before{content:'🎤 Your turn!';position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;font-weight:800;font-size:14px;letter-spacing:.03em;padding:3px 14px;border-radius:var(--r-pill);border:3px solid #fff;white-space:nowrap;box-shadow:0 3px 8px rgba(224,72,136,.25)}
.yourturn .note{text-align:center}

/* matching: Lebanese tiles vs meaning tiles */
.mt[data-s=L]{background:var(--sky-l);border-color:#C6E6FB;box-shadow:0 4px 0 #C6E6FB}
.mt[data-s=R]{background:var(--orange-l);border-color:#FFD9BB;box-shadow:0 4px 0 #FFD9BB}
.mt.sel{background:var(--purple-l)!important;border-color:var(--purple)!important;box-shadow:0 4px 0 #D6C6FF!important}
.mt.done{background:var(--green-bg)!important;border-color:var(--green)!important;box-shadow:none!important}
.mt.no{background:var(--red-bg)!important;border-color:var(--red)!important}

/* quiz options: picture tiles get a soft frame */
.opt img{box-shadow:0 0 0 4px #fff,0 4px 10px rgba(30,42,90,.12)}
.opts:not(.list) .opt{gap:8px}

/* conversation: hint card */
.hint{box-shadow:var(--sh-1)}

/* results: glowing burst behind stars / trophy */
.center .bigstar{position:relative;display:inline-block;padding:14px 26px;margin-top:4px;border-radius:var(--r-pill);background:radial-gradient(closest-side,rgba(255,200,61,.45),rgba(255,200,61,0))}
.center h1{font-size:32px;color:var(--purple-d)}
.center .clip{border-radius:56px 56px 24px 24px}

/* certificate */
.cert{padding-top:34px}
.cert::before{content:'⭐ Yalla Nehke ⭐';position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;font-weight:800;font-size:14px;letter-spacing:.06em;padding:5px 18px;border-radius:var(--r-pill);border:3px solid #fff;box-shadow:var(--sh-1)}
.cert .clip{border-radius:56px 56px 24px 24px}

/* rewards: sticker album */
.screen:has(.book) h3{display:flex;align-items:center;gap:8px;margin-top:18px}
.screen:has(.book) h3::before{content:'';width:10px;height:22px;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--purple),var(--pink))}
.book{background:rgba(255,255,255,.6);border:2px dashed #DCCBFF;border-radius:var(--r-lg);padding:12px}

/* practice: word pills */
.screen:has(#pr) .pill{padding:5px 14px;font-size:15px;box-shadow:0 2px 0 rgba(30,42,90,.08)}
.screen:has(#pr) h3{margin-top:22px}

/* parent area */
.screen:has(.grid2) h3{display:flex;align-items:center;gap:8px}
.screen:has(.grid2) h3::before{content:'';width:10px;height:22px;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--sky),var(--turq))}
.screen:has(.grid2) .prow{background:#fff;border-radius:var(--r-sm);padding:8px 12px;box-shadow:var(--sh-1)}
.screen:has(#pg) .card{margin-top:6px}
.screen:has(#pg) input{font-size:26px;text-align:center;font-weight:800}

/* ==========================================================
   RESPONSIVE – presentation only
   small phones ≤380 · tablets ≥768 · desktop ≥1100
   ========================================================== */
img,video{max-width:100%}
.book{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts,.match,.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.list{grid-template-columns:minmax(0,1fr)}
.opt,.mt,.bubble,.kid,.hint{overflow-wrap:anywhere}
/* desktop pointers: clear hover feedback */
@media (hover:hover){
 .btn:hover{filter:brightness(1.06)}
 .opt:not(.sel):not(.ok):not(.no):not([disabled]):hover,.mt:not(.sel):not(.done):hover,.seg button:not(.on):hover,.ltab:not(.on):hover{border-color:var(--sky);transform:translateY(-2px)}
 .node:not(.locked):hover{transform:translateY(-3px) scale(1.04)}
 .nav button:not(.on):hover{color:var(--navy)}
 .nav button:not(.on):hover i{background:#F1F4FB}
}
/* small phones */
@media (max-width:380px){
 html,body{font-size:16px}
 .screen{padding:12px 12px 116px}
 h1{font-size:26px}.screen>h1:first-child{font-size:24px;padding:14px 16px}
 .stats{gap:6px;padding:8px 12px}.stat{font-size:15px;padding:3px 9px}.goal{width:38px;height:38px}
 .btn{font-size:18px;min-height:52px;padding:10px 16px}
 .hero-in{padding:12px 6px 10px 12px;min-height:200px}
 .hero-ch{flex-basis:108px}.hero .av.full{width:108px;height:140px}
 .hero .bubble{font-size:16px;padding:10px 12px}
 .kick{font-size:11px;padding:2px 10px}
 .unit{gap:10px;padding:12px}.unit .ui{width:46px;height:46px;font-size:26px}.unit b{font-size:18px}
 .unit .jump{padding:6px 9px;font-size:13px}
 .av{width:72px;height:72px}.av.full{width:88px;height:96px}
 .bubble{font-size:16px;padding:10px 12px}
 .pic{width:156px;height:156px;font-size:80px}.big-ar{font-size:38px}.tr{font-size:25px}
 .opts{gap:10px}.opt{min-height:104px;font-size:16px}.opt .e{font-size:46px}
 .opt img{width:76px!important;height:76px!important}
 .mt{font-size:15px;min-height:58px}.mt .ar{font-size:21px}
 .mic{width:84px;height:84px;font-size:34px}
 .bigstar{font-size:52px}.center .bigstar{padding:10px 14px}
 .center h1{font-size:28px}
 .chips{gap:8px}.chip{min-width:0;flex:1 1 30%;padding:8px 8px;font-size:19px}
 .book{gap:6px;padding:8px}.stk{font-size:11px;padding:8px 2px}.stk .e{width:44px;height:44px;font-size:28px}
 .kpi{padding:10px 10px}.kpi b{font-size:22px}
 .seg button{min-width:0}
 .nav{padding-left:4px;padding-right:4px}.nav button{font-size:11px}.nav button i{width:40px}
 .cert{padding:30px 14px 18px}
}
/* tablets */
@media (min-width:768px){
 #app,.nav,.foot,.sheet .in{max-width:720px}
 html,body{font-size:18px}
 .screen{padding:20px 28px 132px}
 h1{font-size:34px}.screen>h1:first-child{font-size:32px;padding:22px 26px}
 .sub{font-size:18px}.note{font-size:15px}
 .stats{padding:12px 28px}.stat{font-size:19px}
 .btn{font-size:20px;min-height:60px}
 .btn.wide{max-width:560px;display:block;margin-left:auto;margin-right:auto}
 .hero{min-height:290px}.hero-in{min-height:282px;padding:22px 18px 18px 24px}
 .hero-ch{flex-basis:180px}.hero .av.full{width:180px;height:224px;border-radius:90px 90px 26px 26px}
 .hero .bubble{font-size:22px}.hprog{max-width:360px}
 .unit{padding:16px 22px}.unit b{font-size:22px}
 .sea{padding:52px 0 32px}.path{gap:24px}
 .isle{width:120px;height:104px}.node{width:84px;height:76px;font-size:32px}.node.chest{width:92px}
 .av{width:96px;height:96px}.av.full{width:120px;height:130px}
 .bubble{font-size:20px}
 .word{padding:24px}.pic{width:230px;height:230px;font-size:120px}.big-ar{font-size:54px}.tr{font-size:32px}.en{font-size:20px}
 .opts{gap:16px}.opt{min-height:150px;font-size:20px}.opt .e{font-size:64px}
 .opt img{width:110px!important;height:110px!important}
 .opts.list .opt{min-height:74px}
 .match{gap:14px}.mt{min-height:72px;font-size:19px}.mt .ar{font-size:28px}
 .mic{width:108px;height:108px;font-size:44px}
 .yourturn:not(:empty){max-width:560px;margin-left:auto;margin-right:auto}
 .hint{max-width:560px;margin:0 auto}
 .chip{min-width:120px;font-size:24px}
 .grid2{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
 .book{gap:14px;padding:16px}.stk{font-size:14px}.stk .e{width:64px;height:64px;font-size:42px}
 .card{padding:24px}
 .seg button{font-size:17px;padding:14px}
 .nav button{font-size:13px}.nav button i{font-size:26px;width:54px;height:40px}
 .foot{padding-left:28px;padding-right:28px}
 .cert{padding:40px 36px 28px}
}
/* desktop */
@media (min-width:1100px){
 #app,.nav,.foot,.sheet .in{max-width:880px}
 .screen{padding:24px 40px 136px}
 .screen:has(.ltop),.screen.center{max-width:760px;margin:0 auto}
 .foot>*{max-width:680px;margin-left:auto;margin-right:auto}
 .hero{min-height:330px}.hero-in{min-height:322px;padding:28px 32px 22px 36px}
 .hero-ch{flex-basis:220px}.hero .av.full{width:220px;height:272px;border-radius:110px 110px 30px 30px}
 .hero .bubble{font-size:24px;max-width:460px}
 .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
 .screen:has(.book) .book{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* ==========================================================
   QA pass – map unit colours from course data onto the new palette
   (colours come from curriculum.js inline; CSS-only remap)
   ========================================================== */
.unit[style*="#14A39A"]{background:linear-gradient(135deg,#2FD6C8,var(--turq-d))!important}
.unit[style*="#7F77DD"]{background:linear-gradient(135deg,#A77BFF,var(--purple-d))!important}
.unit[style*="#E5484D"]{background:linear-gradient(135deg,#FF8DBB,var(--pink-d))!important}
.unit[style*="#FF9F1C"]{background:linear-gradient(135deg,#FFAE5E,var(--orange-d))!important}
.node[style*="#14A39A"]:not(.locked){background:var(--turq)!important}
.node[style*="#7F77DD"]:not(.locked){background:var(--purple)!important}
.node[style*="#E5484D"]:not(.locked){background:var(--pink)!important}
.node[style*="#FF9F1C"]:not(.locked){background:var(--orange)!important}

/* QA fixes: certificate rows in Rewards, certificate ribbon spacing */
.screen:has(.book) .stk[style*="text-align:left"]{display:flex;align-items:center;gap:8px;min-height:52px}
.screen:has(.book) .stk [data-c]{float:none!important;margin-left:auto;min-height:0;flex-shrink:0}
.screen:has(.cert){padding-top:30px}

/* ---------- parent accounts: sign-in & child picker ---------- */
.screen.auth .welcome,.screen.kids>h1:first-child{position:relative}
.screen.auth .welcome{overflow:hidden;margin:6px 0 16px;padding:22px 16px 16px;border-radius:var(--r-xl);border:4px solid #fff;background:#6EC3F2 url(home_hero.webp) 30% 55%/cover no-repeat;box-shadow:var(--sh-2);text-align:center}
.screen.auth .welcome h1,.screen.auth .welcome .sub{display:inline-block;background:rgba(255,255,255,.94);border-radius:var(--r-md);padding:6px 16px;box-shadow:var(--sh-1)}
.screen.auth .welcome h1{color:var(--purple-d);font-size:30px;margin:60px 0 8px}
.screen.auth .welcome .sub{margin:0;font-size:15px;color:var(--navy-2)}
.screen.auth .card #am{margin-bottom:4px}
input[type=email],input[type=password]{width:100%;font:inherit;font-size:19px;font-weight:600;padding:12px 16px;border-radius:var(--r-sm);border:2px solid var(--line);background:#F8FAFF;color:var(--navy)}
input[type=email]:focus,input[type=password]:focus{border-color:var(--sky);background:#fff;outline:none}
.err.ok{color:var(--turq-d)}
.linkb{background:none;padding:4px;font-weight:800;font-size:15px;color:var(--sky-d);text-decoration:underline;text-underline-offset:3px}
.ordiv{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--soft);font-weight:700;font-size:14px}
.ordiv::before,.ordiv::after{content:'';flex:1;height:2px;background:var(--line);border-radius:2px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.gl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0)}
.screen.kids>h1:first-child{background:linear-gradient(135deg,var(--purple),var(--sky))}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:8px}

function normAr(t){return String(t).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^ء-يa-z ]/g,' ').replace(/\s+/g,' ').trim()}
function normLat(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ʿʾ'’]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const sim=(a,b)=>(!a||!b)?0:1-lev(a,b)/Math.max(a.length,b.length);
function winBest(h,t){if(!h||!t)return 0;if(h.includes(t))return 1;const hw=h.split(' '),n=t.split(' ').length;let b=sim(h,t);for(let i=0;i+n<=hw.length;i++)b=Math.max(b,sim(hw.slice(i,i+n).join(' '),t));return b}

// iPad/iPhone fallback: speech engine heard nothing -> check the microphone level directly
let srDead=false;
function levelCheck(box,onDone,label){
 srDead=true;
 const show=(m,live,extra='')=>{if(!box.isConnected)return;box.innerHTML=`<button class="mic ${live?'live':''}" id="mic" aria-label="Speak">${IC('mic')}</button><div class="heard">${m}</div><div class="meter"><i id="mt"></i></div>${extra}`;const b=box.querySelector('#mic');if(b&&!live)b.onclick=run};
 const back=()=>{try{if(actx&&actx.state==='suspended')actx.resume()}catch(e){}};
 let busy=false;
 async function run(){if(busy)return;busy=true;vstop();try{if(actx&&actx.state==='running')actx.suspend()}catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();try{ac.resume()}catch(e){}
  let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){busy=false;try{ac.close()}catch(_){}back();show('The microphone is switched off. Allow the microphone for this site in your browser settings, then tap the mic again.',false);return}
  try{await ac.resume()}catch(e){}
  const an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(st).connect(an);
  let mr=null,chunks=[];try{mr=new MediaRecorder(st);mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mr.start()}catch(e){mr=null}
  show('Listening… say it now! 🎤',true);
  const DUR=3500,buf=new Uint8Array(an.fftSize);let peak=0,loud=0;const t0=performance.now();
  await new Promise(res=>{const tick=()=>{an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}const r=Math.sqrt(s/buf.length);peak=Math.max(peak,r);if(r>.03)loud++;const el=performance.now()-t0;const m=box.querySelector('#mt');if(m){m.style.transition='none';m.style.width=Math.min(100,el/DUR*100)+'%';m.style.background=loud>=6?'var(--green)':'var(--teal)'}if(el<DUR&&box.isConnected)requestAnimationFrame(tick);else res()};tick()});
  const heard=loud>=6&&peak>.04;
  const success=()=>{busy=false;back();show('I heard you! 👏 Great speaking!',false);const m=box.querySelector('#mt');if(m){m.style.transition='none';m.style.width='100%';m.style.background='var(--green)'}setTimeout(()=>{if(box.isConnected)onDone(true,null)},700)};
  const fin=()=>{try{st.getTracks().forEach(t=>t.stop())}catch(e){}try{ac.close()}catch(e){}
   if(!heard){busy=false;back();show("I couldn't hear you. Tap the mic and try again!",false);return}
   if(!chunks.length){success();return}
   back();if(box.isConnected)box.innerHTML=`<button class="mic" id="mic" aria-label="Speak" disabled>${IC('mic')}</button><div class="heard">Listen to yourself… 🔊</div><div class="meter"><i id="mt" style="width:100%;background:var(--green)"></i></div>`;
   let doneP=false;const after=()=>{if(doneP)return;doneP=true;success()};
   try{const a=new Audio(URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/mp4'})));a.onended=after;a.onerror=after;const p=a.play();if(p&&p.catch)p.catch(after);setTimeout(after,DUR+2500)}catch(e){after()}};
  if(mr&&mr.state!=='inactive'){mr.onstop=fin;try{mr.stop()}catch(e){fin()}}else fin();

}
function listen(ar,tr,box,onDone,label){

const lvl=id=>COURSE.find(l=>l.id===id);
function nodes(L){const out=[];L.units.forEach(u=>{(u.lessons||[]).forEach((ls,i)=>out.push({k:`${L.id}-${u.id}-${i+1}`,type:'lesson',u,ls,i}));if(u.lessons){out.push({k:`${L.id}-${u.id}-R`,type:'review',u});out.push({k:`${L.id}-${u.id}-T`,type:'test',u})}});return out}
function levelOpen(L){if(L.soon)return false;return true;if(L.id===1)return true;if(P&&P.level>=L.id)return true;const prev=lvl(L.id-1);return nodes(prev).every(n=>G.done[n.k])}
function isUnlocked(L,n){return true;const all=nodes(L),idx=all.findIndex(x=>x.k===n.k);if(idx===0)return levelOpen(L);if(G.unlocked[`${L.id}-${n.u.id}`]&&(n.type==='lesson'||nodes(L).filter(x=>x.u===n.u&&x.type==='lesson').every(x=>G.done[x.k])))return true;return !!G.done[all[idx-1].k]}
function currentNode(L){return nodes(L).find(n=>isUnlocked(L,n)&&!G.done[n.k])}
function unitWords(u){return [...new Set(u.lessons.flatMap(l=>l.words))]}

function mark(id,ok){if(!W[id])return;const r=G.w[id]||{s:0,due:0,ok:0,bad:0};if(ok){r.s=Math.min(5,r.s+1);r.ok++}else{r.s=Math.max(0,r.s-2);r.bad++}r.due=Date.now()+INT[r.s];G.w[id]=r;G.acc.n++;if(ok){G.acc.ok++;questTick('right')}}
function dueWords(n,exclude=[]){const now=Date.now();return learned().filter(k=>!exclude.includes(k)).sort((a,b)=>(G.w[a].due-G.w[b].due)||(G.w[a].s-G.w[b].s)).filter((k,i)=>G.w[k].due<=now||i<n).slice(0,n)}

function dayIdx(s){const p=String(s).split('-').map(Number);return Math.round(new Date(p[0],p[1]-1,p[2]).getTime()/864e5)}
function bumpStreak(d){const s=G.streak;if(s.last===d)return;
 if(!s.last){s.n=1}else{const gap=dayIdx(d)-dayIdx(s.last)-1;
  if(gap<=0)s.n++;else if(gap<=(G.shields||0)){G.shields-=gap;s.n++;G._note={t:'shield',n:gap}}else{G._note={t:'fresh',n:s.n};s.n=1}}
 s.last=d;G.best=Math.max(G.best||0,s.n);
 if(s.n>1&&s.n%7===0&&(G.shields||0)<2){G.shields=(G.shields||0)+1;G._note={t:'earn'}}
 if([3,7,14,30,50,100].includes(s.n))setEvent(`reached a ${s.n}-day streak`)}
const flameCls=()=>{const n=G.streak.n;return n>=30?'f4':n>=7?'f3':n>=3?'f2':''};
function streakNote(){const n=G._note;if(!n)return '';G._note=null;save();
 if(n.t==='shield')return `<div class="fnote">${IC('flame','in')} Your streak shield kept your ${G.streak.n}-day streak safe!</div>`;
 if(n.t==='fresh')return `<div class="fnote">${IC('flame','in')} A brand new streak starts today! Your best ever is ${G.best} days.</div>`;
 if(n.t==='earn')return `<div class="fnote">🛡️ You earned a streak shield! It saves your streak if you miss a day.</div>`;return ''}

const QPOOL={island:{t:'Finish 1 island',n:1},say:{t:'Say 5 words into the mic',n:5},right:{t:'Get 15 answers right',n:15},practice:{t:'Do a practice round',n:1},bonus:{t:'Play a bonus round',n:1},xp:{t:'Earn 40 stars',n:40}};
function quests(){const d=today();if(!G.quests||G.quests.d!==d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;
  const rest=['say','right','practice','bonus'];const a=rest[h%4],b=rest[(h>>3)%4]===a?rest[(h%4+1)%4]:rest[(h>>3)%4];
  G.quests={d,list:[h%2?'island':'xp',a,b].map(k=>({k,v:0})),claimed:false}}return G.quests}
function questTick(k,x=1){const q=quests();q.list.forEach(it=>{if(it.k===k)it.v=Math.min(QPOOL[k].n,it.v+x)})}
const questsDone=()=>quests().list.every(it=>it.v>=QPOOL[it.k].n);
function questsHTML(){const q=quests(),all=questsDone();
 return `<div class="quests"><div class="qh"><b>${IC('target','in')} Today's quests</b>${q.claimed?'<span class="qok">Chest opened ✓</span>':all?'<button class="btn y qclaim" id="qclaim">Open chest!</button>':`<img class="qchest" src="ui/i_chest.webp" alt="">`}</div>
 ${q.list.map(it=>{const Q=QPOOL[it.k],p=Math.round(it.v/Q.n*100);return `<div class="qrow ${it.v>=Q.n?'ok':''}"><span>${it.v>=Q.n?'✅':'⬜'} ${Q.t}</span><div class="qbar"><i style="width:${p}%"></i></div><small>${Math.min(it.v,Q.n)}/${Q.n}</small></div>`}).join('')}</div>`}
function bindQuests(){const b=$('qclaim');if(b)b.onclick=()=>{const q=quests();if(q.claimed)return;q.claimed=true;save();openChest(2,'All quests done!',()=>route())}}

 let pool=learned().filter(picWord).filter(k=>!G.stk[k]);if(!pool.length)pool=stickerSets().flatMap(s=>s.ws).filter(k=>!G.stk[k]);

function startBonus(cb){const pool=bonusPool();let score=0,left=30,last=null,over=false;
 app.innerHTML=`<div class="screen bonus"><div class="btop"><span class="bonusbadge">⚡ BONUS</span><div class="btime"><i id="btb"></i></div><b id="bsc">0</b></div><div id="bq"></div></div>`;
 const tick=setInterval(()=>{left--;const b=$('btb');if(b)b.style.width=(left/30*100)+'%';if(left<=0)end()},1000);

 function end(){if(over)return;over=true;clearInterval(tick);vstop();const xp=score*4;questTick('bonus');addXP(xp);if(score>=8)setEvent(`scored ${score} in a bonus round`);save();sfx.done();confetti();
  app.innerHTML=`<div class="screen center"><div class="bonusbadge">⚡ BONUS ROUND</div><h1>${score} right!</h1><div class="chips"><div class="chip">+${xp}<small>double stars</small></div></div>${guideHTML(score>=8?'Wow, super fast! 🚀':'Great effort! Try again next time!','cheer')}<button class="btn wide" id="bdone">Continue</button></div>`;

 next()}

 <div class="kpi"><b>${acc}%</b><span>answers correct</span></div><div class="kpi"><b>${spk===null?'–':spk+'%'}</b><span>speaking checks passed (70%+)</span></div>
 <div class="kpi"><b>${IC('flame','in')} ${G.streak.n}</b><span>day streak</span></div><div class="kpi"><b>${G.xp}</b><span>total XP</span></div></div>
 <h3 style="margin-top:16px">Last 7 days (XP)</h3><div class="card" style="display:flex;align-items:flex-end;gap:8px;height:120px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(d.x/mx*70)}px;background:var(--teal);border-radius:6px 6px 0 0;min-height:3px"></div><small class="note">${d.l}</small></div>`).join('')}</div>
 ${COURSE.filter(l=>!l.soon).map(L=>`<h3 style="margin-top:16px">Unit progress · Level ${L.id}</h3>`+L.units.map(u=>{const ns=nodes(L).filter(n=>n.u===u),d=ns.filter(n=>G.done[n.k]).length;return `<div class="prow"><span style="width:130px">${UI(L,u,'in')} ${esc(u.title)}</span><div class="pb"><i style="width:${Math.round(d/ns.length*100)}%"></i></div><b>${G.tests[`${L.id}-${u.id}-T`]!=null?G.tests[`${L.id}-${u.id}-T`]+'%':'–'}</b></div>`}).join('')).join('')}<p class="note">The % on the right is the best unit-test score (70% passes).</p>
 <h3 style="margin-top:16px">Words to practise</h3><div>${weak.length?weak.map(k=>`<span class="pill">${esc(word(k).tr)} · ${esc(word(k).en)}</span>`).join(''):'<span class="note">None yet 👍</span>'}</div>
 <h3 style="margin-top:20px">Settings</h3><div class="card">
 <button class="btn ghost wide" id="edit">Edit name, boy/girl, level</button><div style="height:10px"></div>
 <button class="btn ghost wide" id="snd">Sound effects: ${G.sound?'On':'Off'}</button><div style="height:10px"></div>
 <button class="btn ghost wide" id="rst" style="color:var(--red)">Reset all progress</button></div>
 <h3 style="margin-top:20px">Family league</h3><div class="card" id="lgbox"><p class="note">Loading…</p></div>
 <h3 style="margin-top:20px">Account</h3><div class="card acct">${ACC.user?`<p class="note" style="margin:0 0 10px">Signed in as <b>${esc(ACC.user.email||'')}</b>. Progress is saved online, so ${esc(P.name)} can continue on any device.</p><button class="btn ghost wide" id="swc">${IC('parents','in')} Switch or add a child</button><div style="height:10px"></div><button class="btn ghost wide" id="out">Sign out</button>`:`<p class="note" style="margin:0 0 10px">Progress is saved on this device only. Create a free parent account to keep it safe and continue on any device.</p><button class="btn wide" id="acct">Sign in or create an account</button>`}</div>
 <p class="note" style="margin-top:12px">Privacy: progress is saved on this device${ACC.user?' and in your Yalla Nehke parent account':' only'}. The speaking check uses the browser's speech service (Google or Apple); no recordings are kept by this app.</p>`);
 $('edit').onclick=()=>setup(false);acctButtons();bindLeagueParent();$('snd').onclick=()=>{G.sound=!G.sound;save();parentScreen()};
 $('rst').onclick=()=>sheet(`<h2>Reset everything?</h2><p class="sub">All XP, streaks, stickers and word progress for ${esc(P.name)} will be deleted. This can't be undone.</p><button class="btn wide" id="ry" style="background:var(--red);box-shadow:0 5px 0 #B5363A">Yes, reset</button><div style="height:10px"></div><button class="btn ghost wide" id="rn">Cancel</button>`,()=>{$('ry').onclick=()=>{G=fresh();save();closeSheet();parentScreen()};$('rn').onclick=closeSheet});
}
const LEVELS=[{n:'Beginner',d:'No Arabic yet'},{n:'Elementary',d:'Knows some words'},{n:'Intermediate',d:'Understands simple speech'},{n:'Confident',d:'Understands well'}];
function setup(first){
 const p=P||{name:'',gender:'b',level:1,char:'zena'};
 app.innerHTML=`<div class="screen"><div style="text-align:center"><div style="font-size:54px">🏝️</div><h1>${first?'Yalla Nehke!':'Child settings'}</h1><p class="sub">${first?"Let's talk Lebanese! A parent sets this up once.":'Changes are saved on this device.'}</p></div>
 <div class="card"><label for="nm">Child's first name</label><input type="text" id="nm" value="${esc(p.name)}" placeholder="Maya" maxlength="20">
 <label>Boy or girl? <span class="note">(Lebanese words change: kīfak / kīfik)</span></label><div class="seg" id="gd"><button data-v="b" class="${p.gender==='b'?'on':''}">Boy</button><button data-v="g" class="${p.gender==='g'?'on':''}">Girl</button></div>
 <label>Who will be your guide?</label><div class="seg" id="ch">${['zena','karim'].map(c=>`<button data-v="${c}" class="${p.char===c?'on':''}" style="padding:6px"><div class="av" style="width:70px;height:70px;margin:0 auto;background-image:url(${ASSETS[c].portrait})"></div>${ASSETS[c].name}</button>`).join('')}</div>
 <label>Starting level</label><div class="seg" id="lv">${LEVELS.map((l,i)=>`<button data-v="${i+1}" class="${p.level===i+1?'on':''}">${i+1}. ${l.n}<small>${l.d}</small></button>`).join('')}</div>
 <p class="note">Levels 3–4 are being built. Starting at Level 2 opens it straight away (Level 1 stays available to practise).</p>
 <p class="err" id="er"></p><button class="btn wide" id="go">${first?"Let's start!":'Save'}</button>${first?'':'<div style="height:10px"></div><button class="btn ghost wide" id="cn">Cancel</button>'}</div></div>`;
 ['gd','ch','lv'].forEach(id=>app.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{app.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
 $('nm').oninput=()=>$('er').textContent='';
 $('go').onclick=()=>{const name=$('nm').value.trim();if(!name){$('er').textContent="Enter your child's first name first.";return}
  const lvl_=+app.querySelector('#lv .on').dataset.v;
  P={name,gender:app.querySelector('#gd .on').dataset.v,char:app.querySelector('#ch .on').dataset.v,level:lvl_};
  if(lvl_>=2){['1-2','1-3','1-4'].forEach(k=>G.unlocked[k]=true)}route.init=0;
  save();tab='map';route()};
 const c=$('cn');if(c)c.onclick=()=>{tab='parents';route()};
}

// ---------- parent accounts & online saving (Supabase) ----------
const SB_URL='https://uadeadufficsfsjirabz.supabase.co',SB_KEY='sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4';
let SB=null;try{if(window.supabase&&window.supabase.createClient)SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){SB=null}
const ACC={user:null,child:store.get('yn2_child',null),kids:[],local:store.get('yn2_local',false),busy:false};
const BASE=location.origin+location.pathname;
let cloudT=null,cloudBusy=false;
function cloudSave(){try{if(!SB||!ACC.user||!P)return;clearTimeout(cloudT);cloudT=setTimeout(cloudPush,700)}catch(e){}}
async function cloudPush(){if(!SB||!ACC.user||!P)return;if(cloudBusy){cloudSave();return}cloudBusy=true;cloudT=null;
 try{if(!ACC.child){let cid=store.get('yn2_cid',null);if(!cid){cid=(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));store.set('yn2_cid',cid)}const r=await SB.from('children').upsert({id:cid,profile:P,progress:G},{onConflict:'id'}).select('id').single();if(!r.error&&r.data){ACC.child=r.data.id;store.set('yn2_child',r.data.id)}}
  else{const r=await SB.from('children').update({profile:P,progress:G,updated_at:new Date().toISOString()}).eq('id',ACC.child);if(r.error)cloudSave()}}catch(e){setTimeout(cloudSave,5000)}
 cloudBusy=false}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloudT){clearTimeout(cloudT);cloudPush()}});
function useChild(row){ACC.child=row.id;store.set('yn2_child',row.id);store.set('yn2_cid',row.id);P=row.profile;G=Object.assign(fresh(),row.progress||{});store.set('yn2_profile',P);store.set('yn2_progress',G);parentOK=false;route.init=0;tab='map';route()}
function newChild(){ACC.child=null;store.set('yn2_child',null);store.set('yn2_cid',null);P=null;G=fresh();route.init=0;tab='map';setup(true)}
function authScreen(msg){
 let mode='in';
 const draw=()=>{app.innerHTML=`<div class="screen auth"><div class="welcome"><h1>Yalla Nehke!</h1><p class="sub">Parents: sign in to save your children's progress and continue on any device.</p></div>
 <div class="card"><div class="seg" id="am"><button data-v="in" class="${mode==='in'?'on':''}">Sign in</button><button data-v="up" class="${mode==='up'?'on':''}">Create account</button></div>
 <label for="aem">Parent's email</label><input type="email" id="aem" autocomplete="email" placeholder="you@example.com">
 <label for="apw">Password</label><input type="password" id="apw" autocomplete="${mode==='in'?'current-password':'new-password'}" placeholder="${mode==='in'?'Your password':'At least 8 characters'}">
 <p class="err" id="aer">${msg?esc(msg):''}</p><button class="btn wide" id="ago">${mode==='in'?'Sign in':'Create account'}</button>
 ${mode==='in'?'<p class="center" style="margin:10px 0 0"><button class="linkb" id="afg">Forgot password?</button></p>':''}
 <div class="ordiv"><span>or</span></div><button class="btn ghost wide gbtn" id="agg"><span class="gl">G</span> Continue with Google</button></div>
 <p class="center" style="margin-top:16px"><button class="linkb" id="aloc">Continue without an account (saved on this device only)</button></p></div>`;
 app.querySelectorAll('#am button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;msg='';draw()});
 const er=t=>{$('aer').textContent=t};
 $('ago').onclick=async()=>{const em=$('aem').value.trim(),pw=$('apw').value;if(!em||!pw)return er('Enter your email and password.');if(mode==='up'&&pw.length<8)return er('Use at least 8 characters for the password.');
  $('ago').disabled=true;er('');
  try{if(mode==='in'){const r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error){$('ago').disabled=false;return er(/confirm/i.test(r.error.message)?'Please confirm your email first (check your inbox).':'Email or password is not right.')}await afterLogin(r.data.user)}
  else{const r=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:BASE}});if(r.error){$('ago').disabled=false;return er(r.error.message)}
   if(r.data.session)await afterLogin(r.data.user);else{mode='in';msg='';draw();$('aem').value=em;$('aer').className='err ok';er('Almost done! We sent a confirmation link to '+em+'. Open it, then sign in here.')}}}catch(e){$('ago').disabled=false;er('No connection. Please try again.')}};
 const fg=$('afg');if(fg)fg.onclick=async()=>{const em=$('aem').value.trim();if(!em)return er('Type your email first, then tap “Forgot password?”.');try{await SB.auth.resetPasswordForEmail(em,{redirectTo:BASE});$('aer').className='err ok';er('We sent a password reset link to '+em+'.')}catch(e){er('No connection. Please try again.')}};
 $('agg').onclick=async()=>{try{const r=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:BASE}});if(r.error)er('Google sign-in is not available yet. Please use email.')}catch(e){er('No connection. Please try again.')}};
 $('aloc').onclick=()=>{ACC.local=true;store.set('yn2_local',true);route()};
 };draw();
}
async function afterLogin(user){
 if(ACC.busy)return;ACC.busy=true;ACC.user=user;ACC.local=false;store.set('yn2_local',false);
 app.innerHTML=`<div class="screen center"><div class="bigstar">${IC('learn','big')}</div><p class="sub">Loading your family…</p></div>`;
 let rows=null;try{const r=await SB.from('children').select('*').order('created_at');if(!r.error)rows=r.data}catch(e){}
 ACC.busy=false;
 if(rows===null){return P?route():setup(true)}
 ACC.kids=rows;
 const mine=rows.find(x=>x.id===ACC.child);
 if(mine)return useChild(mine);
 if(!rows.length){if(P){ACC.child=null;await cloudPush();return route()}return newChild()}
 if(rows.length===1&&!P)return useChild(rows[0]);
 kidsScreen();
}
async function kidsScreen(){
 if(ACC.user){try{const r=await SB.from('children').select('*').order('created_at');if(!r.error)ACC.kids=r.data}catch(e){}}
 const rows=ACC.kids,orphan=P&&!ACC.child&&!rows.some(r=>r.profile&&r.profile.name===P.name)?P:null;
 app.innerHTML=`<div class="screen kids"><h1>Who's learning today?</h1><p class="sub">Pick a child to continue their adventure.</p>
 <div class="kgrid">${rows.map((r,i)=>{const p=r.profile||{},g=r.progress||{};return `<button class="kid-card" data-i="${i}"><span class="kav" style="background-image:url(${(ASSETS[p.char]||ASSETS.zena).portrait})"></span><b>${esc(p.name||'Child')}</b><span class="kmeta">Level ${p.level||1} · ${IC('star','in')} ${g.xp||0} XP</span></button>`}).join('')}
 ${orphan?`<button class="kid-card dev" id="kdev"><span class="kav" style="background-image:url(${(ASSETS[orphan.char]||ASSETS.zena).portrait})"></span><b>${esc(orphan.name)}</b><span class="kmeta">On this device · tap to save online</span></button>`:''}
 <button class="kid-card add" id="kadd"><span class="kplus">＋</span><b>Add a child</b><span class="kmeta">New profile</span></button></div>
 <p class="note center" style="margin-top:18px">Signed in as <b>${esc(ACC.user?ACC.user.email||'':'')}</b> · <button class="linkb" id="kout">Sign out</button></p></div>`;
 app.querySelectorAll('.kid-card[data-i]').forEach(b=>b.onclick=()=>{sfx.tap();useChild(rows[+b.dataset.i])});
 $('kadd').onclick=()=>{sfx.tap();newChild()};
 const d=$('kdev');if(d)d.onclick=async()=>{ACC.child=null;await cloudPush();route.init=0;tab='map';route()};
 $('kout').onclick=signOut;
}
async function signOut(){try{await SB.auth.signOut()}catch(e){}ACC.user=null;ACC.child=null;ACC.kids=[];['yn2_child','yn2_cid','yn2_profile','yn2_progress'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});P=null;G=fresh();parentOK=false;route.init=0;tab='map';authScreen()}
function acctButtons(){const a=$('acct');if(a)a.onclick=()=>{ACC.local=false;store.set('yn2_local',false);authScreen()};const w=$('swc');if(w)w.onclick=()=>{cloudPush();kidsScreen()};const o=$('out');if(o)o.onclick=()=>sheet(`<h2>Sign out?</h2><p class="sub">Progress is saved in your account. You can sign in again on any device.</p><button class="btn wide" id="oy">Sign out</button><div style="height:10px"></div><button class="btn ghost wide" id="on">Cancel</button>`,()=>{$('oy').onclick=()=>{closeSheet();signOut()};$('on').onclick=closeSheet})}
function newPasswordSheet(){sheet(`<h2>Choose a new password</h2><label for="npw">New password</label><input type="password" id="npw" autocomplete="new-password" placeholder="At least 8 characters"><p class="err" id="npe"></p><button class="btn wide" id="npg">Save password</button>`,()=>{$('npg').onclick=async()=>{const pw=$('npw').value;if(pw.length<8){$('npe').textContent='Use at least 8 characters.';return}const r=await SB.auth.updateUser({password:pw});if(r.error){$('npe').textContent=r.error.message;return}closeSheet();toast('Password saved ✅')}})}
async function boot(){
 if(!SB)return route();
 let s=null;try{s=(await SB.auth.getSession()).data.session}catch(e){}
 SB.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(newPasswordSheet,300);else if(ev==='SIGNED_IN'&&ses&&!ACC.user)afterLogin(ses.user)});
 if(s)return afterLogin(s.user);
 if(ACC.local)return route();
 authScreen();
}
boot();
})();
</script>
</body>
</html>
