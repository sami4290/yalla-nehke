<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yalla Nehke – Lebanese for Kids (draft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6E5;--card:#FFFFFF;--ink:#3B2A1E;--soft:#7A6553;--teal:#14A39A;--teal-d:#0E7C75;--yellow:#FFC93C;--red:#E5484D;--green:#2FA866;--line:#EADCC4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:16px 16px 40px;display:flex;flex-direction:column}
.draft{background:#FFE9A8;color:#6B4B00;font-size:13px;text-align:center;border-radius:12px;padding:6px 10px;margin-bottom:12px}
h1{font-size:30px;margin:4px 0 2px;line-height:1.1}
h2{font-size:22px;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 16px;font-size:16px}
.btn{background:var(--teal);color:#fff;font-weight:700;font-size:20px;padding:14px 22px;border-radius:18px;box-shadow:0 5px 0 var(--teal-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #D9A41B}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.wide{width:100%}
.row{display:flex;gap:12px}
.card{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:16px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.charpick{background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px;text-align:center;font-size:20px;font-weight:700;color:var(--ink)}
.charpick img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:14px;background:var(--cream)}
.charpick.on{border-color:var(--teal);box-shadow:0 0 0 4px #14A39A33}
.sess{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;width:100%;text-align:left;color:var(--ink)}
.sess .ic{font-size:34px;width:54px;height:54px;border-radius:16px;background:var(--cream);display:flex;align-items:center;justify-content:center}
.sess b{font-size:19px;display:block}
.sess span{color:var(--soft);font-size:14px}
.sess .st{margin-left:auto;font-size:18px;white-space:nowrap}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .3s}
.x{background:#fff;border:2px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:18px;color:var(--soft)}
.stars{font-weight:800;font-size:18px}
.stage{flex:1;display:flex;flex-direction:column;gap:14px}
.guide{display:flex;align-items:flex-end;gap:10px}
.guide .av{width:92px;height:92px;border-radius:50%;background-color:#fff;background-repeat:no-repeat;background-size:290%;background-position:50% 4%;border:3px solid var(--line);flex-shrink:0}
.bubble{background:#fff;border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:19px;line-height:1.35;position:relative;flex:1}
.vo{display:inline-block;font-size:11px;background:#EAF6F5;color:var(--teal-d);border-radius:8px;padding:1px 7px;margin-bottom:4px;font-weight:700}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;unicode-bidi:isolate}
.word{text-align:center}
.pic{width:220px;height:220px;margin:0 auto 10px;border-radius:24px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:110px;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .ph{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;background:#FFE9A8;color:#6B4B00;border-radius:8px;padding:1px 8px;white-space:nowrap}
.pic.dash{border-style:dashed}
.big-ar{font-size:44px;line-height:1.3;margin:0}
.tr{font-size:28px;font-weight:800;color:var(--teal-d);margin:0}
.en{font-size:18px;color:var(--soft);margin:2px 0 0}
.yourturn{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.ring{width:84px;height:84px;border-radius:50%;border:8px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 14px;font-size:20px;text-align:left;color:var(--ink);display:flex;align-items:center;gap:10px}
.opt .ar{font-size:24px;margin-left:auto}
.opt.ok{border-color:var(--green);background:#E8F7EE}
.opt.no{border-color:var(--red);background:#FDECEC;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kid{align-self:flex-end;background:#E8F7EE;border:2px solid #BFE6CF;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:19px;max-width:80%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:3px solid var(--line);border-radius:20px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.ok{border-color:var(--green);box-shadow:0 0 0 4px #2FA86633}
.tile.no{border-color:var(--red);animation:shake .35s}
.chant{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px}
.cl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;font-size:22px;font-weight:700;opacity:.45;transition:all .25s}
.cl.on{opacity:1;background:#FFF1C9;transform:scale(1.03)}
.cl .act{font-size:30px}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);background:#fff;border:3px solid var(--yellow);border-radius:24px;padding:14px 22px;font-size:28px;font-weight:800;opacity:0;pointer-events:none;transition:all .25s;z-index:5;text-align:center}
.praise.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.end{text-align:center}
.end .bigstar{font-size:80px;line-height:1}
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:16px;font-weight:700;color:var(--ink)}
.seg button.on{border-color:var(--teal);background:#EAF6F5}
.lvl small{display:block;font-weight:500;color:var(--soft);font-size:13px}
.note{font-size:14px;color:var(--soft)}
.err{color:var(--red);font-size:14px;min-height:18px}
.spacer{flex:1}
.mic{width:96px;height:96px;border-radius:50%;background:var(--red);color:#fff;font-size:40px;box-shadow:0 6px 0 #B5363A}
.mic.live{animation:pulse .8s infinite}
.meter{width:100%;max-width:320px;height:16px;border-radius:10px;background:#fff;border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .4s}
.heard{font-size:15px;color:var(--soft);text-align:center}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 16px}
.stk{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:10px 4px;text-align:center;font-size:13px;color:var(--soft)}
.stk .e{font-size:40px;display:block;filter:grayscale(1);opacity:.35}
.stk.got{border-style:solid;border-color:var(--yellow);color:var(--ink);font-weight:700}
.stk.got .e{filter:none;opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cert{background:#fff;border:6px double var(--yellow);border-radius:24px;padding:22px;text-align:center}
.cert h1{font-size:28px}
.newstk{font-size:90px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.ctrl{display:flex;gap:10px;margin-top:auto;padding-top:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="praise" id="praise"></div>
<script>
(function(){
// ---------- storage (safe) ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let profile=store.get('yn_profile',null);
let progress=store.get('yn_progress',{sessions:{},history:[]});
const IMG={zena:'zena.webp',karim:'karim.webp',marhaba:'marhaba.webp'};
const CH={zena:{name:'Zena',img:IMG.zena},karim:{name:'Karim',img:IMG.karim}};

// gender helpers: g(boyForm, girlForm) addresses the CHILD
const kidBoy=()=>!profile||profile.gender!=='g';
const g=(b,gl)=>kidBoy()?b:gl;
const charName=()=>CH[profile.char].name;
const kidName=()=>profile.name||'friend';

// ---------- vocabulary ----------
// pic: image key or emoji placeholder
function V(){return {
 marhaba:{ar:'مرحبا',tr:'marḥaba',en:'hello',pic:'img:marhaba'},
 kifak:{ar:g('كيفك؟','كيفِك؟'),tr:g('kīfak?','kīfik?'),en:'how are you?',pic:'🙂'},
 mnih:{ar:g('منيح','منيحة'),tr:g('mnīḥ','mnīḥa'),en:"good / I'm fine",pic:'😄'},
 shukran:{ar:'شكراً',tr:'shukran',en:'thank you',pic:'🎁'},
 ismi:{ar:'إسمي…',tr:'ismi…',en:'my name is…',pic:'🏷️'},
 bye:{ar:'يلّا باي',tr:'yalla bye',en:'bye!',pic:'🚪'},
 mama:{ar:'ماما',tr:'māma',en:'mum',pic:'👩'},
 baba:{ar:'بابا',tr:'bāba',en:'dad',pic:'👨'},
 teta:{ar:'تيتا',tr:'teta',en:'grandma',pic:'👵'},
 jeddo:{ar:'جدّو',tr:'jeddo',en:'grandpa',pic:'👴'},
 khayyi:{ar:'خيّي',tr:'khayyi',en:'my brother',pic:'👦'},
 ikhti:{ar:'إختي',tr:'ikhti',en:'my sister',pic:'👧'},
 habibi:{ar:g('حبيبي','حبيبتي'),tr:g('ḥabībi','ḥabībti'),en:'my darling',pic:'❤️'},
 khebz:{ar:'خبز',tr:'khebz',en:'bread',pic:'🫓'},
 mayy:{ar:'مَي',tr:'mayy',en:'water',pic:'💧'},
 halib:{ar:'حليب',tr:'ḥalīb',en:'milk',pic:'🥛'},
 tiffaha:{ar:'تفّاحة',tr:'tiffāḥa',en:'apple',pic:'🍎'},
 manoushe:{ar:'منقوشة',tr:"man'ūshe",en:"man'ūshe (za'tar flatbread)",pic:'🍕'},
 baddi:{ar:'بدّي…',tr:'baddi…',en:'I want…',pic:'🙋'},
 zeki:{ar:'زاكي!',tr:'zēki!',en:'tasty!',pic:'😋'}
};}

// ---------- sessions (Level 1 – Beginner) ----------
function SESSIONS(){const v=V(),C=charName(),K=kidName();return [
 {id:1,title:'Hello!',icon:'👋',blurb:'Say hello, how are you, thank you and bye',steps:[
  {t:'talk',text:`<span class="ar">${v.marhaba.ar}</span> <b>${v.marhaba.tr}!</b> Hi ${K}! I'm ${C}, and this is my cat, Bisseh! Today you'll learn how to say hello in Lebanese. Ready?`},
  {t:'word',w:'marhaba',line:'When we say hello, we say…'},
  {t:'word',w:'kifak',line:`To ask ${g('a boy','a girl')} "how are you?", we say…`},
  {t:'word',w:'mnih',line:`If you feel good, you say…`},
  {t:'chat',say:{ar:v.kifak.ar,tr:v.kifak.tr,en:'How are you?'},lead:`Let's practise! I'll ask you…`,opts:[{w:'mnih',ok:1},{w:'bye'},{w:'shukran'}],after:`${g('Mnīḥ','Mnīḥa')}! Me too!`},
  {t:'word',w:'shukran',line:'When someone gives you something, say thank you…'},
  {t:'word',w:'ismi',line:`To say your name: "ismi ${C}". Now you: ismi… and your name!`},
  {t:'chat',say:{ar:g('شو إسمك؟','شو إسمِك؟'),tr:g('shu ismak?','shu ismik?'),en:"What's your name?"},lead:'Now I want to know your name…',opts:[{custom:`ismi ${K}`,ar:`إسمي ${K}`,ok:1},{w:'marhaba'},{w:'mnih'}],after:`Tsharrafna, ${K}! (Nice to meet you!)`},
  {t:'chat',say:{ar:'',tr:'🎁',en:'Bisseh brings you a present!'},lead:'Bisseh has a little present for you…',opts:[{w:'shukran',ok:1},{w:'kifak'},{w:'ismi'}],after:'Bisseh says: Miaow! 🐱'},
  {t:'word',w:'bye',line:'And when we leave, Lebanese people say…'},
  {t:'tap',lead:'Game time! Tap the right picture.',items:['marhaba','kifak','mnih','shukran','ismi','bye'],rounds:5},
  {t:'chant',lines:[['marhaba','marḥaba, marḥaba!','👏'],['kifak',`${v.kifak.tr} ${v.kifak.tr}`,'👉'],['mnih',`${v.mnih.tr}, ${v.mnih.tr}!`,'😄'],['shukran','shukran, shukran!','🙏'],['bye','yalla bye!','👋']]},
  {t:'chat',say:{ar:v.bye.ar,tr:'yalla bye!',en:'Bye!'},lead:`Time to go! I say…`,opts:[{w:'bye',ok:1},{w:'marhaba'},{w:'shukran'}],after:'See you next time!'}
 ]},
 {id:2,title:'My family',icon:'👨‍👩‍👧',blurb:'Mum, dad, grandma, grandpa, brother, sister',steps:[
  {t:'talk',text:`<span class="ar">${v.marhaba.ar}</span> <b>marḥaba</b> ${K}! ${g('Kīfak','Kīfik')}? Today you'll meet my family!`},
  {t:'chat',say:{ar:v.kifak.ar,tr:v.kifak.tr,en:'How are you?'},lead:'Do you remember? I ask…',opts:[{w:'mnih',ok:1},{w:'teta'},{w:'bye'}],after:'Bravo! You remembered!'},
  {t:'word',w:'mama',line:'This is my mum. In Lebanese we say…'},
  {t:'word',w:'baba',line:'And my dad is…'},
  {t:'word',w:'teta',line:'My grandma makes the best food. She is my…'},
  {t:'word',w:'jeddo',line:'My grandpa tells funny stories. He is my…'},
  {t:'tap',lead:'Who is it? Tap the right picture.',items:['mama','baba','teta','jeddo'],rounds:4},
  {t:'word',w:'khayyi',line:'My brother is…'},
  {t:'word',w:'ikhti',line:'My sister is…'},
  {t:'chat',say:{ar:'هيدي تيتا',tr:'haydi teta',en:'This is grandma'},lead:`I show you a photo and say "haydi teta". Who is it?`,opts:[{w:'teta',ok:1},{w:'jeddo'},{w:'baba'}],after:'Yes! Teta! 👵'},
  {t:'word',w:'habibi',line:`Lebanese families say this to people they love. Teta calls you…`},
  {t:'tap',lead:'Last game! Tap the right picture.',items:['mama','baba','teta','jeddo','khayyi','ikhti'],rounds:5},
  {t:'chant',lines:[['mama','māma, bāba!','👩'],['teta','teta, jeddo!','👵'],['khayyi','khayyi, ikhti!','👦'],['habibi',`kellon ${v.habibi.tr}!`,'❤️']]},
  {t:'chat',say:{ar:v.bye.ar,tr:'yalla bye!',en:'Bye!'},lead:'Bye bye! I say…',opts:[{w:'bye',ok:1},{w:'mama'},{w:'shukran'}],after:`Bye ${v.habibi.tr}!`}
 ]},
 {id:3,title:'Yummy food',icon:'🍎',blurb:'Bread, water, milk, apple and I want…',steps:[
  {t:'talk',text:`<span class="ar">${v.marhaba.ar}</span> <b>marḥaba</b> ${K}! I'm hungry! Let's learn food words.`},
  {t:'word',w:'khebz',line:'Bread is…'},
  {t:'word',w:'mayy',line:'Water is…'},
  {t:'word',w:'halib',line:'Milk is…'},
  {t:'word',w:'tiffaha',line:'An apple is…'},
  {t:'word',w:'manoushe',line:"And Lebanon's favourite breakfast is…"},
  {t:'tap',lead:'Tap the right food!',items:['khebz','mayy','halib','tiffaha','manoushe'],rounds:5},
  {t:'word',w:'baddi',line:'To ask for something, say "baddi" and the thing. "Baddi mayy" means "I want water".'},
  {t:'chat',say:{ar:g('بدّك مَي؟','بدِّك مَي؟'),tr:g('baddak mayy?','baddik mayy?'),en:'Do you want water?'},lead:"You're thirsty! I ask you…",opts:[{custom:'ē, baddi mayy!',ar:'إي، بدّي مَي!',ok:1},{w:'tiffaha'},{w:'bye'}],after:'Tfaḍḍal! Here you go 💧'},
  {t:'chat',say:{ar:g('شو بدّك؟','شو بدِّك؟'),tr:g('shu baddak?','shu baddik?'),en:'What do you want?'},lead:"It's breakfast time! I ask…",opts:[{custom:"baddi man'ūshe!",ar:'بدّي منقوشة!',ok:1},{w:'mnih'},{w:'teta'}],after:"Yummy! Here's your man'ūshe 🍕"},
  {t:'word',w:'zeki',line:'When food is yummy, we say…'},
  {t:'chat',say:{ar:'زاكية؟',tr:'zēkye?',en:'Is it tasty?'},lead:"You're eating your man'ūshe. I ask…",opts:[{custom:'ktīr zēkye!',ar:'كتير زاكية!',ok:1},{w:'bye'},{w:'mama'}],after:'Saḥtein! (Enjoy your food!)'},
  {t:'chant',lines:[['khebz','khebz w ḥalīb!','🥛'],['tiffaha','tiffāḥa!','🍎'],['baddi','baddi mayy!','💧'],['zeki','zēki, zēki!','😋']]},
  {t:'chat',say:{ar:v.bye.ar,tr:'yalla bye!',en:'Bye!'},lead:'All done! I say…',opts:[{w:'bye',ok:1},{w:'khebz'},{w:'marhaba'}],after:'Bravo! See you soon!'}
 ]}
];}

// ---------- rewards ----------
const STICKERS={1:{e:'👋',n:'Hello Hero'},2:{e:'🏡',n:'Family Star'},3:{e:'🍎',n:'Yummy Champ'}};
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#FFC93C','#14A39A','#E5484D','#2FA866','#7F77DD'];for(let i=0;i<70;i++){const b=document.createElement('i');b.style.left=Math.random()*100+'%';b.style.background=cols[i%cols.length];b.style.animationDelay=(Math.random()*0.8)+'s';b.style.animationDuration=(2+Math.random()*1.5)+'s';c.appendChild(b)}document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}

// ---------- speaking check (70% match) ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const PASS=0.70;
function normAr(t){return String(t).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\u0621-\u064Aa-z ]/g,' ').replace(/\s+/g,' ').trim()}
function normLat(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function sim(a,b){if(!a||!b)return 0;const L=Math.max(a.length,b.length);return 1-lev(a,b)/L}
function score(heardList,targetAr,targetTr){let best=0;const ta=normAr(targetAr),tl=normLat(targetTr);
 for(const h of heardList){const ha=normAr(h),hl=normLat(h);best=Math.max(best,sim(ha,ta),sim(hl,tl));
  // also allow the target word appearing inside a longer phrase
  if(ta&&ha.includes(ta))best=1;}
 return best}
let micBlocked=false;
function listen(targetAr,targetTr,box,onDone){
 // onDone(passed:boolean|null)  null = speaking check not available
 if(!SR||micBlocked){return onDone(null)}
 let tries=0,errs=0;
 const ui=(msg,live)=>{box.innerHTML=`<button class="mic ${live?'live':''}" id="mic" aria-label="Speak">🎤</button><div class="heard" id="hd">${msg}</div><div class="meter"><i id="mt"></i></div>`;document.getElementById('mic').onclick=go};
 const go=()=>{let rec;try{rec=new SR()}catch(e){micBlocked=true;return onDone(null)}
  rec.lang='ar-LB';rec.maxAlternatives=5;rec.interimResults=false;
  ui('Listening… say it now!',true);let got=false;
  rec.onresult=e=>{got=true;const alts=[];for(const r of e.results)for(let k=0;k<r.length;k++)alts.push(r[k].transcript);
   const sc=score(alts,targetAr,targetTr),pct=Math.round(sc*100);tries++;
   const mt=document.getElementById('mt');
   if(sc>=PASS){ui(`I heard: "${esc(alts[0])}" · ${pct}% match`,false);mt.style.width=pct+'%';mt.style.background='var(--green)';setTimeout(()=>onDone(true),900)}
   else if(tries<2){ui(`Almost! ${pct}% match. Tap the mic and try once more.`,false);mt.style.width=pct+'%';mt.style.background='var(--yellow)'}
   else{ui(`Good try! ${pct}% match. We'll practise it again later.`,false);mt.style.width=pct+'%';mt.style.background='var(--yellow)';setTimeout(()=>onDone(false),1300)}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){micBlocked=true;onDone(null)}else{errs++;if(errs>=2){onDone(null)}else{ui("I didn't hear you. Tap the mic and try again!",false)}}};
  rec.onend=()=>{if(!got&&!micBlocked&&document.getElementById('mic')){const m=document.getElementById('mic');m.classList.remove('live')}};
  try{rec.start()}catch(e){micBlocked=true;onDone(null)}};
 ui(`Tap the mic and say <b>${esc(targetTr)}</b>`,false);
}
let spoken={ok:0,tries:0};

// ---------- rendering helpers ----------
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pic(p,cls){if(p&&p.startsWith('img:'))return `<div class="${cls}"><img src="${IMG[p.slice(4)]}" alt=""></div>`;return `<div class="${cls} dash">${p}<span class="ph">image coming</span></div>`}
function tilePic(p){return p&&p.startsWith('img:')?`<img src="${IMG[p.slice(4)]}" alt="">`:p}
function guide(html){return `<div class="guide"><div class="av" role="img" aria-label="${charName()}" style="background-image:url(${CH[profile.char].img})"></div><div class="bubble"><span class="vo">🔊 ${charName()}'s voice – coming</span><br>${html}</div></div>`}
let praiseT;function praise(txt){const p=document.getElementById('praise');p.innerHTML=txt;p.classList.add('show');clearTimeout(praiseT);praiseT=setTimeout(()=>p.classList.remove('show'),900)}
const PR=()=>[`Bravo! ⭐`,`${g('Shāṭer','Shāṭra')}! ⭐`,`Yalla! ⭐`,`Ktīr ḥelo! ⭐`];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- screens ----------
function home(){
 if(!profile){return setup(true)}
 const S=SESSIONS();
 $app.innerHTML=`<div class="draft">Draft for review · voices and most pictures are placeholders</div>
 <div class="row" style="align-items:center"><div style="flex:1"><h1>Yalla Nehke!</h1><p class="sub">Let's talk Lebanese, ${esc(kidName())}!</p></div><button class="x" id="par" aria-label="Parent settings">⚙️</button></div>
 <h2>Who's your friend today?</h2>
 <div class="chars">${['zena','karim'].map(c=>`<button class="charpick ${profile.char===c?'on':''}" data-c="${c}"><img src="${CH[c].img}" alt="">${CH[c].name}</button>`).join('')}</div>
 <h2>Level ${profile.level} · ${LEVELS[profile.level-1].name}</h2>
 ${profile.level>1?`<p class="note">This draft only has Level 1 sessions. Higher levels come next, so Level 1 is shown for now.</p>`:''}
 ${S.map(s=>{const p=progress.sessions[s.id];return `<button class="sess" data-s="${s.id}"><div class="ic">${s.icon}</div><div><b>${s.id}. ${s.title}</b><span>${s.blurb}</span></div><div class="st">${p?'⭐'.repeat(p.stars):'▶️'}</div></button>`}).join('')}
 <h2 style="margin-top:14px">My sticker book</h2>
 <div class="book">${[1,2,3].map(i=>`<div class="stk ${progress.sessions[i]?'got':''}"><span class="e">${STICKERS[i].e}</span>${progress.sessions[i]?STICKERS[i].n:'Finish lesson '+i}</div>`).join('')}</div>
 ${[1,2,3].every(i=>progress.sessions[i])?'<button class="btn y wide" id="cert">🏆 My certificate</button>':''}
 ${levelHint()}`;
 $app.querySelectorAll('.charpick').forEach(b=>b.onclick=()=>{profile.char=b.dataset.c;store.set('yn_profile',profile);home()});
 $app.querySelectorAll('.sess').forEach(b=>b.onclick=()=>play(+b.dataset.s));
 document.getElementById('par').onclick=()=>setup(false);
 const ce=document.getElementById('cert');if(ce)ce.onclick=certificate;
}
const LEVELS=[{name:'Beginner',d:'No Arabic yet'},{name:'Elementary',d:'Knows some words'},{name:'Intermediate',d:'Understands simple speech'},{name:'Confident',d:'Understands well, wants to speak more'}];
function levelHint(){const h=progress.history.slice(-2);if(h.length===2&&h.every(x=>x>=80)&&profile.level<4)return `<div class="card" style="margin-top:8px">🎉 <b>Great progress!</b> The last 2 games were 80%+ correct. A parent can move up to Level ${profile.level+1} in ⚙️ settings.</div>`;return ''}

function setup(first){
 const p=profile||{name:'',gender:'b',level:1,char:'zena'};
 $app.innerHTML=`<div class="draft">Draft for review</div>
 <h1>${first?'Welcome!':'Parent settings'}</h1><p class="sub">${first?'A parent sets this up once.':'Change your child\'s details or level.'}</p>
 <div class="card">
 <label for="nm">Child's first name</label><input type="text" id="nm" value="${esc(p.name)}" placeholder="Maya" maxlength="20">
 <label>Boy or girl? <span class="note">(Lebanese words change, e.g. kīfak / kīfik)</span></label>
 <div class="seg" id="gd"><button data-v="b" class="${p.gender==='b'?'on':''}">Boy</button><button data-v="g" class="${p.gender==='g'?'on':''}">Girl</button></div>
 <label>Starting level</label>
 <div class="seg lvl" id="lv">${LEVELS.map((l,i)=>`<button data-v="${i+1}" class="${p.level===i+1?'on':''}">${i+1}. ${l.name}<small>${l.d}</small></button>`).join('')}</div>
 <p class="err" id="er"></p>
 <button class="btn wide" id="go">${first?"Let's start!":'Save'}</button>
 ${first?'':'<p class="note" style="margin-top:12px"><button class="btn ghost wide" id="rs">Reset progress</button></p>'}
 </div>`;
 const seg=id=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
 seg('gd');seg('lv');
 const nm=document.getElementById('nm');nm.oninput=()=>document.getElementById('er').textContent='';
 document.getElementById('go').onclick=()=>{const name=nm.value.trim();if(!name){document.getElementById('er').textContent='Enter your child\'s first name first.';return}
  profile={name,gender:document.querySelector('#gd .on').dataset.v,level:+document.querySelector('#lv .on').dataset.v,char:p.char||'zena'};store.set('yn_profile',profile);home()};
 const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{progress={sessions:{},history:[]};store.set('yn_progress',progress);home()};
}

// ---------- session player ----------
let S,si,stars,tapStats;
function play(id){S=SESSIONS().find(s=>s.id===id);si=0;stars=0;tapStats={ok:0,tries:0};spoken={ok:0,tries:0};step()}
function frame(inner,ctrl){
 const pct=Math.round(si/S.steps.length*100);
 $app.innerHTML=`<div class="top"><button class="x" id="ex" aria-label="Exit">✕</button><div class="bar"><i style="width:${pct}%"></i></div><div class="stars">⭐ ${stars}</div></div><div class="stage">${inner}</div>${ctrl?`<div class="ctrl">${ctrl}</div>`:''}`;
 document.getElementById('ex').onclick=home;
}
function next(){si++;step()}
function step(){
 if(si>=S.steps.length)return finish();
 const st=S.steps[si],v=V();
 ({talk,word,chat,tap,chant}[st.t])(st,v);
}
function talk(st){frame(guide(st.text)+`<div class="spacer"></div>`,`<button class="btn wide" id="nx">Next ▶</button>`);document.getElementById('nx').onclick=next}
function word(st,v){
 const w=v[st.w];
 frame(guide(esc(st.line))+`<div class="word">${pic(w.pic,'pic')}<p class="big-ar ar">${w.ar}</p><p class="tr">${w.tr}</p><p class="en">${w.en}</p></div><div class="yourturn" id="yt"><button class="btn y" id="say">🗣️ Your turn! Say it</button></div>`);
 document.getElementById('say').onclick=()=>{
  const yt=document.getElementById('yt');
  listen(w.ar,w.tr,yt,res=>{
   if(res===true){spoken.ok++;spoken.tries++;stars++;praise(pick(PR()));setTimeout(next,700);return}
   if(res===false){spoken.tries++;setTimeout(next,300);return}
   // no microphone available: countdown + "I said it"
   let n=3;yt.innerHTML=`<div class="ring" id="rg">${n}</div><div class="note">Say <b>${w.tr}</b> out loud!</div>`;
   const iv=setInterval(()=>{n--;if(n>0){document.getElementById('rg').textContent=n}else{clearInterval(iv);yt.innerHTML=`<button class="btn" id="did">I said it! ✅</button><button class="btn ghost" id="again">Hear it again 🔁</button>`;
    document.getElementById('did').onclick=()=>{stars++;praise(pick(PR()));setTimeout(next,700)};
    document.getElementById('again').onclick=()=>praise('🔊 voice coming soon')}},1000);
  });
 };
}
function chat(st,v){
 const opts=shuffle(st.opts.map(o=>{const w=o.w&&v[o.w];return {ok:!!o.ok,tr:o.custom||w.tr,ar:o.ar||(w?w.ar:'')}}));
 const sayHtml=st.say.ar?`<span class="ar" style="font-size:26px">${st.say.ar}</span><br><b style="font-size:22px;color:var(--teal-d)">${st.say.tr}</b> <span class="note">(${st.say.en})</span>`:`<b style="font-size:22px">${st.say.tr}</b> <span class="note">${st.say.en}</span>`;
 frame(guide(`${esc(st.lead)}<br>${sayHtml}`)+`<p class="note" style="margin:0">💬 What do you say back? Tap it, then say it out loud!</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${esc(o.tr)}</b><span class="ar">${o.ar}</span></button>`).join('')}</div><div id="reply"></div>`);
 let done=false,first=true;
 $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;const o=opts[+b.dataset.i];
  if(o.ok){done=true;b.classList.add('ok');if(first)stars++;praise(pick(PR()));
   const rp=document.getElementById('reply');
   const showAfter=()=>{rp.innerHTML=`<div class="kid">🗣️ ${esc(o.tr)}</div><div style="height:8px"></div>${guide(esc(st.after))}<div style="height:10px"></div><button class="btn wide" id="nx">Next ▶</button>`;document.getElementById('nx').onclick=next};
   if(SR&&!micBlocked){rp.innerHTML=`<p class="note" style="text-align:center;margin:6px 0">Now say it out loud!</p><div class="yourturn" id="cy"></div>`;
    listen(o.ar||o.tr,o.tr,document.getElementById('cy'),res=>{if(res===true){spoken.ok++;spoken.tries++;stars++;praise(pick(PR()))}else if(res===false){spoken.tries++}showAfter()});
   }else showAfter();
  }else{first=false;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);praise('Oops, try again! 🙂')}});
}
function tap(st,v){
 const order=shuffle(st.items).slice(0,st.rounds);let r=0;
 const round=()=>{
  if(r>=order.length)return next();
  const target=order[r],choices=shuffle([target,...shuffle(st.items.filter(x=>x!==target)).slice(0,3)]);
  frame(guide(`${esc(st.lead)}<br><span class="vo" style="margin-top:6px">Round ${r+1} of ${order.length}</span><br><span class="ar" style="font-size:28px">${v[target].ar}</span> <b style="font-size:24px;color:var(--teal-d)">${v[target].tr}</b>`)+`<div class="grid">${choices.map(c=>`<button class="tile" data-w="${c}" aria-label="${v[c].en}">${tilePic(v[c].pic)}</button>`).join('')}</div>`);
  let first=true;
  $app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{tapStats.tries++;
   if(b.dataset.w===target){b.classList.add('ok');if(first){tapStats.ok++;stars++}praise(pick(PR()));r++;setTimeout(round,800)}
   else{first=false;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);praise('Try again! 🙂')}});
 };round();
}
function chant(st){
 frame(guide("Chant time! Say it with me and do the actions!")+`<div class="chant">${st.lines.map((l,i)=>`<div class="cl" id="cl${i}"><span class="act">${l[2]}</span><span>${esc(l[1])}</span></div>`).join('')}</div>`,`<button class="btn ghost" id="rp">Again 🔁</button><button class="btn" id="nx" style="flex:1">Next ▶</button>`);
 let t;const run=()=>{clearInterval(t);let i=0;const lit=()=>{st.lines.forEach((_,k)=>document.getElementById('cl'+k).classList.toggle('on',k===i))};lit();t=setInterval(()=>{i++;if(i>=st.lines.length){clearInterval(t);st.lines.forEach((_,k)=>document.getElementById('cl'+k)&&document.getElementById('cl'+k).classList.add('on'));return}lit()},1800)};
 run();document.getElementById('rp').onclick=run;document.getElementById('nx').onclick=()=>{clearInterval(t);stars++;next()};
}
function finish(){
 const pct=tapStats.tries?Math.round(tapStats.ok/tapStats.tries*100):100;
 const spk=spoken.tries?Math.round(spoken.ok/spoken.tries*100):null;
 const combined=spk===null?pct:Math.round((pct+spk)/2);
 const s3=combined>=80?3:combined>=50?2:1;
 const prev=progress.sessions[S.id],firstTime=!prev;
 progress.sessions[S.id]={stars:Math.max(s3,prev?prev.stars:0),acc:pct,speak:spk};progress.history.push(combined);store.set('yn_progress',progress);
 const allDone=[1,2,3].every(i=>progress.sessions[i]);
 const st=STICKERS[S.id];
 frame(`<div class="end"><div class="bigstar">${'⭐'.repeat(s3)}</div><h1>${g('Shāṭer','Shāṭra')}, ${esc(kidName())}!</h1>
  <p class="sub">You finished "${S.title}" and earned ${stars} stars!</p>
  <div class="card" style="margin-bottom:12px"><div class="note">${firstTime?'New sticker unlocked!':'Your sticker'}</div><div class="newstk">${st.e}</div><b>${st.n}</b></div>
  <p class="note">Game: ${pct}% correct${spk!==null?` · Speaking: ${spk}% of words passed the 70% check`:''}</p></div>
  ${guide(allDone?`Mabrouk! You finished ALL the lessons! You get a special certificate!`:`Yalla bye! See you in the next lesson!`)}`,
  allDone?`<button class="btn y" id="ct" style="flex:1">🏆 My certificate</button><button class="btn" id="hm" style="flex:1">Lessons 🏠</button>`:`<button class="btn wide" id="hm">Back to lessons 🏠</button>`);
 confetti();
 document.getElementById('hm').onclick=home;
 const ct=document.getElementById('ct');if(ct)ct.onclick=certificate;
}
function certificate(){
 const tot=[1,2,3].reduce((a,i)=>a+(progress.sessions[i]?progress.sessions[i].stars:0),0);
 $app.innerHTML=`<div class="cert"><div style="font-size:60px">🏆</div><p class="note">Certificate of achievement</p><h1>${esc(kidName())}</h1>
 <p class="sub">finished Level 1 of <b>Yalla Nehke!</b><br>and can say hello, talk about family<br>and ask for food in Lebanese!</p>
 <div style="font-size:40px">${[1,2,3].map(i=>STICKERS[i].e).join(' ')}</div><p><b>${tot} of 9 stars</b></p>
 <p class="ar" style="font-size:26px">${g('برافو يا بطل!','برافو يا بطلة!')}</p><p class="note">${g('Bravo ya baṭal!','Bravo ya baṭale!')} (Well done, champion!)</p></div>
 <div style="height:14px"></div><button class="btn wide" id="hm">Back to lessons 🏠</button>`;
 confetti();document.getElementById('hm').onclick=home;
}
home();
})();
</script>
</body>
</html>
