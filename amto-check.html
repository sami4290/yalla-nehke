<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ʿamto check</title></head>
<body style="font:18px sans-serif;padding:20px">
<h2>Zena – ʿamto (pick one)</h2>
<div id="b"></div>
<script>
const O=[[0.3,0.554],[1.454,0.51],[2.564,2.443],[5.606,2.153]];
const L=['Take 1 (Arabic spelling)','Take 2 (Arabic spelling)','Take 3 (3amto spelling)','Take 4 (3amto spelling)'];
let ctx,buf;
async function play(i){ctx=ctx||new AudioContext();if(!buf){const r=await fetch('audio/zena_am1.mp3');buf=await ctx.decodeAudioData(await r.arrayBuffer())}
const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start(0,O[i][0],O[i][1]+0.05)}
O.forEach((o,i)=>{const b=document.createElement('button');b.textContent='▶ '+L[i];b.style.cssText='display:block;width:100%;font-size:22px;padding:18px;margin:10px 0';b.onclick=()=>play(i);document.getElementById('b').appendChild(b)});
</script></body></html>
