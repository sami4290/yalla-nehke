<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Record Karim – Yalla Nehke</title>
<style>
:root{--c:#2E7BE6;--ink:#14213d;--line:#e3e8ef;--ok:#1f9d55}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f8fb;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0;font-size:18px}h1 b{color:var(--c)}.prog{height:8px;background:#eef1f5;border-radius:6px;margin:8px 0 4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);width:0}
.small{font-size:13px;color:#5b6b82}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.card{background:#fff;margin:14px;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(20,33,61,.08);border-top:6px solid var(--c)}
.num{font-size:13px;color:#5b6b82}.ar{font-size:40px;direction:rtl;text-align:center;margin:10px 0 4px;font-family:'Geeza Pro','Noto Naskh Arabic',serif}
.tr{font-size:30px;font-weight:800;text-align:center;color:var(--c)}.en{text-align:center;margin-top:6px}.note{text-align:center;margin-top:4px;font-weight:700;color:#b54708}
.where{text-align:center;font-size:12px;color:#8592a6;margin-top:6px}
.ctr{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;background:#eef1f5;color:var(--ink)}
.rec{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;font-size:34px;padding:0}
.rec.live{background:#d92d20;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.07)}}
.st{text-align:center;margin-top:10px;min-height:20px;font-weight:600}
.list{margin:0 14px 40px;background:#fff;border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr 28px;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row.cur{background:#fff6e0}.row .t{font-weight:700}.row .a{direction:rtl;text-align:right;color:#5b6b82}.done{color:var(--ok);font-weight:900}
.gate{margin:40px 14px;text-align:center}.gate a{color:var(--c);font-weight:700}
</style></head><body>
<header><h1>Re-record · <b>Karim</b></h1>
<div class="prog"><i id="pb"></i></div><div class="small" id="cnt">Loading…</div>
<div class="tools"><select id="flt"><option value="all">All lines</option><option value="todo">Not recorded yet</option><option value="word">Words</option><option value="question">Questions</option><option value="reaction">Reactions</option><option value="intro">Intros</option><option value="answer">Answers</option><option value="app">App lines</option></select>
<input id="go" type="number" min="1" placeholder="Go to #" style="width:96px"><label class="small"><input type="checkbox" id="auto" checked> Auto-next</label></div></header>
<div id="main"></div>
<script src="supabase.js"></script>
<script>
const VOICE='karim',D=[[1, "w_tazkara", "word", "تيكيت", "Tikit", "ticket", "", "UPDATED word (review 16 Nov) · App shows: tikit"], [2, "w_difda", "word", "ضفدعة", "Difda'a", "frog", "", "UPDATED word (review 16 Nov) · App shows: ḍifdaʿa"], [3, "w_mustashfa", "word", "مستشفى", "Mestashfa", "hospital", "", "UPDATED word (review 16 Nov) · App shows: mestashfa"], [4, "w_minshafe", "word", "منشفة", "Manshafy", "towel", "", "UPDATED word (review 16 Nov) · App shows: manshafe"], [5, "w_shurti", "word", "بوليس", "Polees", "police officer", "", "UPDATED word (review 16 Nov) · App shows: polīs"], [6, "w_ghadban_g", "word", "معصّبة", "M'assby", "angry", "girl form (said to a girl)", "UPDATED word (review 16 Nov) · App shows: mʿaṣṣbe"], [7, "w_ghadban_b", "word", "معصّب", "M'assab", "angry", "boy form (said to a boy)", "UPDATED word (review 16 Nov) · App shows: mʿaṣṣab"], [8, "w_hadne", "word", "عبطة", "'abta", "hug", "", "UPDATED word (review 16 Nov) · App shows: ʿabṭa"], [9, "w_hkeye", "word", "قصّة", "Ossa", "story", "", "UPDATED word (review 16 Nov) · App shows: ʾoṣṣa"]];
const SB=window.supabase.createClient('https://uadeadufficsfsjirabz.supabase.co','sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let done=new Set(),cur=0,view=D,stream=null,mr=null,chunks=[],audio=null,user=null;
function key(){try{return 'ynrec_'+VOICE}catch(e){}}
function vis(){const f=$('flt').value;view=D.filter(r=>f==='all'?1:f==='todo'?!done.has(r[1]):r[2]===f);}
function counts(){const n=done.size;$('cnt').textContent=`${n} of ${D.length} recorded · ${D.length-n} to go`;$('pb').style.width=(n/D.length*100)+'%'}
function render(){
 if(!view.length){$('main').innerHTML='<div class="gate">Nothing here 🎉</div>';return}
 if(cur>=view.length)cur=view.length-1;const r=view[cur],has=done.has(r[1]);
 $('main').innerHTML=`<div class="card"><div class="num">#${r[0]} · ${esc(r[2])} · <span class="small">${VOICE}/${String(r[0]).padStart(4,'0')}_${esc(r[1])}</span> ${has?'<span class="done">✓ recorded</span>':''}</div>
 <div class="ar">${esc(r[3])}</div><div class="tr">${esc(r[4])}</div><div class="en">${esc(r[5])}</div>${r[6]?`<div class="note">${esc(r[6])}</div>`:''}<div class="where">${esc(r[7])}</div>
 <div class="ctr"><button id="pv">◀ Prev</button><button class="rec" id="rb">🎙</button>${has?'<button id="pl">▶ Play</button>':''}<button id="nx">Next ▶</button></div><div class="st" id="st">${has?'Tap 🎙 to re-record':'Tap 🎙 to record, tap again to stop'}</div></div>
 <div class="list">${view.map((x,i)=>`<div class="row ${i===cur?'cur':''}" data-i="${i}"><span class="small">#${x[0]}</span><span><span class="t">${esc(x[4])}</span> <span class="small">${esc(x[5])}${x[6]?' · '+esc(x[6]):''}</span></span><span class="done">${done.has(x[1])?'✓':''}</span></div>`).slice(Math.max(0,cur-3),cur+40).join('')}</div>`;
 $('pv').onclick=()=>{if(cur>0){cur--;render()}};$('nx').onclick=()=>{if(cur<view.length-1){cur++;render()}};$('rb').onclick=toggle;if($('pl'))$('pl').onclick=()=>play(r[1]);
 document.querySelectorAll('.row').forEach(e=>e.onclick=()=>{cur=+e.dataset.i;render();scrollTo(0,0)});
}
async function toggle(){
 if(mr&&mr.state==='recording'){mr.stop();return}
 try{if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}})}catch(e){$('st').textContent='Microphone blocked – allow it in the browser settings.';return}
 const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
 chunks=[];mr=new MediaRecorder(stream,mt?{mimeType:mt,audioBitsPerSecond:96000}:{});const r=view[cur];
 mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 mr.onstop=async()=>{$('rb').classList.remove('live');$('st').textContent='Saving…';const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
  const b64=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(b)});
  const {error}=await SB.from('voice_recs').upsert({user_id:user.id,voice:VOICE,line_id:r[1],num:r[0],mime:b.type,audio_b64:b64,clean_b64:null,clean_mime:null,clean_info:null,updated_at:new Date().toISOString()});
  if(error){$('st').textContent='Not saved: '+error.message;return}
  let ci=null;   done.add(r[1]);counts();
  if($('auto').checked&&$('flt').value!=='todo'&&cur<view.length-1)cur++;else if($('flt').value==='todo')vis();
  render();$('st').textContent=(ci?'✓ Saved & cleaned #':'✓ Saved #')+r[0]+' – '+($('auto').checked?'next line ready':'tap ▶ to check');
 };
 mr.start();$('rb').classList.add('live');$('st').textContent='● Recording… tap to stop';
}
async function play(id){$('st').textContent='Loading…';const {data,error}=await SB.from('voice_recs').select('audio_b64,mime,clean_b64,clean_mime').eq('voice',VOICE).eq('line_id',id).single();
 if(error){$('st').textContent=error.message;return}const a=new Audio(data.clean_b64?'data:audio/wav;base64,'+data.clean_b64:'data:'+data.mime+';base64,'+data.audio_b64);a.play().catch(()=>{});$('st').textContent='Playing'}
$('flt').onchange=()=>{vis();cur=0;render()};
$('go').onchange=()=>{$('flt').value='all';vis();const i=D.findIndex(r=>r[0]===+$('go').value);if(i>=0){cur=i;render()}};
(async()=>{const {data:{session}}=await SB.auth.getSession();
 if(!session){$('cnt').textContent='';$('main').innerHTML=`<div class="gate"><h2>Sign in first</h2><p>Open the <a href="beta.html">Yalla Nehke app</a> on this device, sign in with your parent account, then come back to this page.</p></div>`;return}
 user=session.user;const {data,error}=await SB.from('voice_recs').select('line_id').eq('voice',VOICE).limit(5000);if(!error)data.forEach(x=>done.add(x.line_id));
 vis();cur=Math.max(0,view.findIndex(r=>!done.has(r[1])));counts();render()})();
</script></body></html>
