<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>YN picture export 3</title></head>
<body style="font:16px sans-serif;padding:20px">
<h3>Yalla Nehke picture export</h3>
<div id="s">Loading…</div><div id="b"></div>
<script>
const URL_='https://uadeadufficsfsjirabz.supabase.co/rest/v1/yn_pics';
const KEY='sb_publishable_kZWJRKVXxiinTApZ-WyOBw_DYFNqwa4';
(async()=>{
  const since=new URLSearchParams(location.search).get('since')||'1970-01-01';
  const r=await fetch(URL_+'?select=id,b64,created_at&created_at=gt.'+encodeURIComponent(since)+'&order=created_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  const rows=await r.json();window.ROWS=rows;
  document.getElementById('s').textContent='Ready: '+rows.length+' pictures, last '+(rows.length?rows[rows.length-1].created_at:'-');
  const N=40;
  for(let i=0;i<rows.length;i+=N){
    const part=rows.slice(i,i+N);const out={};part.forEach(x=>out[x.id]=x.b64);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download='yn_part'+(i/N+1)+'_'+Date.now()+'.json';a.textContent='Save part '+(i/N+1)+' ('+part.length+')';
    a.style.cssText='display:block;font-size:22px;padding:14px;margin:8px 0;background:#ddd;width:300px';
    document.getElementById('b').appendChild(a);
  }
})();
</script>
</body></html>
